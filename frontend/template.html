  out.push(`${p.pts} pts in ${DATA.gameweek - 1} GW${DATA.gameweek === 2 ? "" : "s"}`);
  if (p.last) out.push(lastSeasonText(p));

  const hard = fixturesInHorizon(p).filter(f => tierOf(f) >= 4).length;
  if (hard >= 2) out.push(`${hard} hard fixtures`);
  const blanks = horizon - fixturesInHorizon(p).length;
  if (blanks > 0) out.push(`${blanks} blank${blanks === 1 ? "" : "s"}`);
  return out.join(" · ");
}

function reasonsIn(p) {
  const out = [`${p.pts} pts`];
  if (p.form > 0) out.push(`form ${p.form}`);
  if (p.last) out.push(lastSeasonText(p));
  const easy = fixturesInHorizon(p).filter(f => tierOf(f) <= 2).length;
  if (easy >= 2) out.push(`${easy} easy fixtures`);
  const extra = fixturesInHorizon(p).length - horizon;
  if (extra > 0) out.push(`${extra} double${extra === 1 ? "" : "s"}`);
  if (p.status !== "available") {
    out.push(p.chance !== null ? `${p.status}, ${p.chance}%` : p.status);
  }
  return out.join(" · ");
}

/** Squad state a candidate has to fit into. */
function transferContext(picks, bankNow) {
  const clubs = new Map();
  for (const p of picks) {
    const t = byId.get(p.id).teamId;
    clubs.set(t, (clubs.get(t) || 0) + 1);
  }
  return { clubs, bank: bankNow, held: new Set(picks.map(p => p.id)) };
}

/** How many candidates per position get the exact (more expensive) scoring. */
const SHORTLIST = 24;

/**
 * Every legal, affordable, better replacement for one player, best first.
 *
 * Scored by how much each swap moves the best XI, so an upgrade that would only
 * sit on the bench correctly scores near zero. That is the expensive part, so a
 * cheap raw-score filter picks a shortlist first.
 */
function optionsFor(pick, ctx, picks, baseline, limit = 4) {
  const out = byId.get(pick.id);
  const sell = sellPrice(pick.buyPrice, out.price);
  const budget = sell + ctx.bank;
  const others = picks.filter(p => p.id !== pick.id);

  const shortlist = DATA.players
    .filter(c =>
      c.pos === out.pos &&
      !ctx.held.has(c.id) &&
      c.price <= budget &&
      availability(c) > 0 &&
      (ctx.clubs.get(c.teamId) || 0) + 1 - (c.teamId === out.teamId ? 1 : 0) <= RULES.maxPerClub)
    .sort((a, b) => horizonScore(b) - horizonScore(a))
    .slice(0, SHORTLIST);

  return shortlist
    .map(c => {
      const after = others.concat([{ id: c.id, buyPrice: c.price }]);
      return {
        outId: out.id,
        inId: c.id,
        gain: squadValueOverHorizon(after) - baseline,
        spend: c.price - sell,
        sell,
      };
    })
    .filter(o => o.gain > 0.05)
    .sort((a, b) => b.gain - a.gain)
    .slice(0, limit);
}

/**
 * Goalkeepers and defenders at the same club share a clean sheet, so they form
 * one correlated unit. Midfielders and forwards score independently enough to
 * be treated separately.
 */
function defensiveUnitKey(p) {
  return (p.pos === "GK" || p.pos === "DEF") ? `${p.teamId}:D` : null;
}

const teamDefenceOf = teamId => (DATA.teamDefence?.teams || {})[String(teamId)] || null;
const isEliteDefence = teamId => !!teamDefenceOf(teamId)?.elite;

/**
 * Two options are within noise of each other when their gains are this close,
 * per gameweek. Below it, the model is not really expressing a preference and
 * should not be read as though it were.
 */
const TOO_CLOSE_TO_CALL = 0.35;

/**
 * The other side of the question: who else could be sold to fund this signing.
 *
 * A suggestion names one player out, but the incoming player rarely cares which
 * of your defenders funds him. Showing only one pairing makes an arbitrary
 * choice look like a considered one, and hides the case that actually confuses
 * people: a player who looks like the obvious sale but is a few hundred grand
 * short of affording the target. That near-miss is reported rather than
 * silently skipped.
 */
function sellAlternatives(move, ctx, picks, baseline) {
  const inn = byId.get(move.inId);
  const alternatives = [];
  const blocked = [];

  for (const pick of picks) {
    if (pick.id === move.outId) continue;
    const out = byId.get(pick.id);
    if (out.pos !== inn.pos) continue;   // squad shape has to survive the swap

    const sell = sellPrice(pick.buyPrice, out.price);
    const shortfall = inn.price - (sell + ctx.bank);
    if (shortfall > 0) {
      blocked.push({ id: pick.id, shortfall });
      continue;
    }

    const after = picks.filter(p => p.id !== pick.id).concat([{ id: inn.id, buyPrice: inn.price }]);
    const clubs = new Map();
    for (const p of after) {
      const t = byId.get(p.id).teamId;
      clubs.set(t, (clubs.get(t) || 0) + 1);
    }
    if ((clubs.get(inn.teamId) || 0) > RULES.maxPerClub) continue;

    alternatives.push({ id: pick.id, gain: squadValueOverHorizon(after) - baseline });
  }

  alternatives.sort((a, b) => b.gain - a.gain);
  // Only near-misses are worth reporting; being £3m short explains itself.
  blocked.sort((a, b) => a.shortfall - b.shortfall);
  return {
    alternatives: alternatives.slice(0, 2),
    blocked: blocked.filter(b => b.shortfall <= 10).slice(0, 2),
  };
}

/**
 * What the next transfer costs in points, right now.
 *
 * Zero while a free transfer is in hand, four once they are gone. Suggestions
 * have to clear this to be worth making at all.
 */
function hitForNextTransfer() {
  if (UNLIMITED_CHIPS.has(state.activeChip)) return 0;
  return transfersMade() < state.freeTransfers ? 0 : RULES.hitCost;
}

/** Best single transfers across the whole squad, each with its near-equal alternatives. */
function singleMoves(limit = 6) {
  if (state.picks.length !== RULES.squadSize) return [];
  const ctx = transferContext(state.picks, bank());
  const baseline = squadValueOverHorizon(state.picks);

  // Keep every player's shortlist, not just its winner: when the top two are a
  // coin flip, hiding the runner-up turns an arbitrary pick into an apparent
  // recommendation. That is how "why Guéhi and not Gvardiol?" happens.
  const byOut = new Map();
  for (const pick of state.picks) {
    byOut.set(pick.id, optionsFor(pick, ctx, state.picks, baseline, 4));
  }

  const all = [...byOut.values()].flat().sort((a, b) => b.gain - a.gain);

  // One row per player out, per player in, and per correlated defensive unit.
  //
  // A club's goalkeeper and defenders all score off the same clean sheet, so
  // two of them are one idea, not two. Listing both as separate rows reads as
  // independent advice when it is really a choice between substitutes — and
  // with the three-per-club limit you often cannot take both anyway. The
  // runner-up still appears on the winner's "too close to call" line.
  //
  // The exception is the point of the exception: behind an elite defence that
  // correlation is what you *want*. Arsenal kept 19 clean sheets in 38 last
  // season, so a keeper and a defender there pay out together often enough to
  // be worth owning together. Those clubs are allowed a second row, labelled as
  // a deliberate double-up rather than passed off as an unrelated idea.
  const seenOut = new Set();
  const seenIn = new Set();
  const seenUnit = new Set();
  const moves = [];
  for (const m of all) {
    const inn = byId.get(m.inId);
    const unit = defensiveUnitKey(inn);
    const doublingUp = unit !== null && seenUnit.has(unit);

    if (seenOut.has(m.outId) || seenIn.has(m.inId)) continue;
    if (doublingUp && !isEliteDefence(inn.teamId)) continue;

    seenOut.add(m.outId);
    seenIn.add(m.inId);
    if (unit !== null) seenUnit.add(unit);

    const threshold = TOO_CLOSE_TO_CALL * Math.max(1, horizon);
    const sellSide = sellAlternatives(m, ctx, state.picks, baseline);
    moves.push({
      ...m,
      doubleUp: doublingUp ? teamDefenceOf(inn.teamId) : null,
      sellAlts: sellSide.alternatives.filter(a => m.gain - a.gain < threshold),
      sellBlocked: sellSide.blocked,
      alts: (byOut.get(m.outId) || [])
        .filter(o => o.inId !== m.inId && m.gain - o.gain < threshold)
        .slice(0, 2),
    });
    if (moves.length >= limit) break;
  }
  return moves;
}

/** Best pairs, priced with the -4 that a second transfer costs. */
function pairMoves(limit = 3) {
  if (state.picks.length !== RULES.squadSize) return [];
  const firsts = singleMoves(4);
  const pairs = [];

  for (const first of firsts) {
    // Apply the first move, then look again with the updated bank and clubs.
    const after = state.picks
      .filter(p => p.id !== first.outId)
      .concat([{ id: first.inId, buyPrice: byId.get(first.inId).price }]);
    const ctx = transferContext(after, bank() - first.spend);
    const baseAfter = squadValueOverHorizon(after);

    for (const pick of after) {
      if (pick.id === first.inId) continue;
      const [best] = optionsFor(pick, ctx, after, baseAfter, 1);
      if (!best) continue;
      const free = Math.min(2, state.freeTransfers);
      const hit = Math.max(0, 2 - free) * RULES.hitCost;
      pairs.push({ first, second: best, gain: first.gain + best.gain, hit });
    }
  }

  pairs.sort((a, b) => (b.gain - b.hit) - (a.gain - a.hit));
  const seen = new Set();
  return pairs.filter(p => {
    if (p.first.outId === p.second.outId) return false;
    // A pair is the same pair whichever leg is named first, so sort the key.
    const key = [p.first.outId, p.second.outId].sort((x, y) => x - y).join(":");
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).slice(0, limit);
}

function applyMove(move) {
  removePlayer(move.outId);
  addPlayer(move.inId);
}

/* =====================================================================
   Auto-pick
   ===================================================================== */

/** Best legal XI from the 15, by expected points. Every legal shape is checked. */
function bestXI(picks, valueFn) {
  const value = valueFn || (id => epOf(id));
  const pool = {};
  for (const pos of POSITIONS) {
    pool[pos] = picks.filter(p => posOf(p.id) === pos)
      .sort((a, b) => valueFn ? value(b.id) - value(a.id) : byRank(a.id, b.id));
  }
  let best = null;
  for (let d = RULES.minStart.DEF; d <= RULES.maxStart.DEF; d++) {
    for (let m = RULES.minStart.MID; m <= RULES.maxStart.MID; m++) {
      for (let f = RULES.minStart.FWD; f <= RULES.maxStart.FWD; f++) {
        if (1 + d + m + f !== RULES.xiSize) continue;
        const need = { GK: 1, DEF: d, MID: m, FWD: f };
        if (POSITIONS.some(pos => pool[pos].length < need[pos])) continue;
        const xi = POSITIONS.flatMap(pos => pool[pos].slice(0, need[pos]));
        const ep = xi.reduce((t, p) => t + value(p.id), 0);
        if (!best || ep > best.ep) best = { ep, ids: new Set(xi.map(p => p.id)) };
      }
    }
  }
  return best;
}

function applyBestXI() {
  if (state.picks.length !== RULES.squadSize) return flash("Fill all 15 places first.");
  const best = bestXI(state.picks);
  if (!best) return flash("No legal XI available from this squad.");

  for (const p of state.picks) { p.starting = best.ids.has(p.id); p.benchRank = p.starting ? null : nextBenchRank(posOf(p.id)); }

  // Bench order by expected points, keepers excluded — they have their own slot.
  benched().filter(p => posOf(p.id) !== "GK")
    .sort((a, b) => byRank(a.id, b.id))
    .forEach((p, i) => { p.benchRank = i + 1; });

  // Only fill empty armbands. Reassigning a captain the manager picked would
  // silently override a decision the page has no business making.
  const rank = starters().sort((a, b) => byRank(a.id, b.id));
  const stillStarting = id => id && pickOf(id)?.starting;
  if (!stillStarting(state.captain)) state.captain = rank[0]?.id ?? null;
  if (!stillStarting(state.vice) || state.vice === state.captain) {
    state.vice = rank.find(p => p.id !== state.captain)?.id ?? null;
  }
  normaliseBench();
  render();
}

/* ---------------------------------------------------------------------
   Auto-pick 15. A helper, not the Phase 5 optimiser: that one is a proper
   integer program over a multi-week horizon.

   What a squad is worth is the expected points of its best XI, not of all 15 —
   bench players score nothing — so that is the objective throughout.
   --------------------------------------------------------------------- */

const MIN_PRICE = 40;   // no player costs less than £4.0m

function squadScore(list, worth) {
  const xi = bestXI(list.map(p => ({ id: p.id })), worth);
  return xi ? xi.ep : -1;
}

/**
 * Fill 15 places greedily, scoring players on points minus a price penalty.
 *
 * `worth` is what a player is valued on — raw rate for the draft, or a
 * fixture-weighted figure for a particular gameweek when the chip advice asks
 * what a one-week squad could do. `budget` is what there is to spend.
 */
function greedyBuild(lambda, worth = epOf, budget = RULES.budget) {
  const ranked = DATA.players
    .filter(p => p.status === "available" && worth(p) > 0)
    .map(p => ({ p, score: worth(p) - lambda * p.price }))
    .sort((a, b) => b.score - a.score);

  const chosen = [];
  const need = { ...RULES.quota };
  const clubs = new Map();
  let spend = 0;

  for (const { p } of ranked) {
    if (need[p.pos] <= 0) continue;
    if ((clubs.get(p.teamId) || 0) >= RULES.maxPerClub) continue;
    // Keep enough back that the remaining places can still be filled.
    const remaining = RULES.squadSize - chosen.length - 1;
    if (spend + p.price > budget - remaining * MIN_PRICE) continue;
    chosen.push(p);
    need[p.pos] -= 1;
    clubs.set(p.teamId, (clubs.get(p.teamId) || 0) + 1);
    spend += p.price;
    if (chosen.length === RULES.squadSize) break;
  }

  return chosen.length === RULES.squadSize && spend <= budget ? chosen : null;
}

/**
 * Spend what the greedy pass left in the bank.
 *
 * Repeatedly swap one player for the best same-position upgrade that still
 * fits the budget and the three-per-club limit, keeping whichever swap raises
 * the best XI most. Candidates are capped per position so this stays fast.
 */
function hillClimb(squad) {
  const CANDIDATES = 40;
  let current = squad.slice();
  let currentScore = squadScore(current);

  for (let pass = 0; pass < 40; pass++) {
    const ids = new Set(current.map(p => p.id));
    const clubs = new Map();
    for (const p of current) clubs.set(p.teamId, (clubs.get(p.teamId) || 0) + 1);
    const spare = RULES.budget - current.reduce((t, p) => t + p.price, 0);

    let bestSwap = null;

    for (let i = 0; i < current.length; i++) {
      const out = current[i];
      const affordable = out.price + spare;

      const options = DATA.players
        .filter(c =>
          c.pos === out.pos &&
          !ids.has(c.id) &&
          c.status === "available" &&
          c.price <= affordable &&
          (clubs.get(c.teamId) || 0) + 1 - (c.teamId === out.teamId ? 1 : 0) <= RULES.maxPerClub)
        .sort(byRank)
        .slice(0, CANDIDATES);

      for (const cand of options) {
        const trial = current.slice();
        trial[i] = cand;
        const score = squadScore(trial);
        if (score > currentScore + 1e-9 && (!bestSwap || score > bestSwap.score)) {
          bestSwap = { score, trial };
        }
      }
    }

    if (!bestSwap) break;
    current = bestSwap.trial;
    currentScore = bestSwap.score;
  }

  return current;
}

function autoPickSquad() {
  // Rebuilding from scratch mid-season re-prices the whole squad, so it only
  // makes sense as a fresh draft or under a Wildcard.
  if (state.confirmed && !UNLIMITED_CHIPS.has(state.activeChip)) {
    if (!confirm("Auto-pick rebuilds all 15 from scratch, which counts as 15 transfers.\n\nPlay a Wildcard first to avoid the points hit. Continue anyway?")) return;
  }

  let best = null;
  for (let lambda = 0; lambda <= 0.6; lambda += 0.02) {
    const squad = greedyBuild(lambda);
    if (!squad) continue;
    const score = squadScore(squad);
    if (!best || score > best.score) best = { score, squad };
  }

  if (!best) return flash("Could not build a legal squad from the current pool.");

  const squad = hillClimb(best.squad);
  const spend = squad.reduce((t, p) => t + p.price, 0);

  state.realised = 0;
  state.picks = squad.map(p => ({ id: p.id, buyPrice: p.price, starting: false, benchRank: null }));
  applyBestXI();
  flash(`Picked 15 for £${money(spend)}m — £${money(RULES.budget - spend)}m left in the bank.`);
}

/* =====================================================================
   Chip timing — when to play the Wildcard, Free Hit, Triple Captain and
   Bench Boost.

   The same projections as the transfer advice, taken one gameweek at a time
   rather than summed over the horizon, because chip timing is *about* the
   individual weeks: a double gameweek is where Triple Captain and Bench
   Boost pay, a blank is where a Free Hit does, and a Wildcard is judged on
   how far the squad is from the best one available over the weeks ahead.

   Each chip is valued at what it would add in every week the page has
   fixtures for, and the advice is the best of those weeks with the number
   behind it. The thresholds are plain heuristics, shown rather than hidden.
   ===================================================================== */

/** Expected points in one gameweek: rate x availability x that week's fixtures. */
function gwScore(p, gw) {
  return rate(p) * availabilityFactor(p) * fixtureWeight(p, gw) * weightScale(p);
}

/** A value function usable by both the squad builder (objects) and bestXI (ids). */
const worthIn = gw => x => gwScore(typeof x === "object" ? x : byId.get(x), gw);
const worthOver = gws => x => {
  const p = typeof x === "object" ? x : byId.get(x);
  return gws.reduce((t, gw) => t + gwScore(p, gw), 0);
};

/**
 * The weeks chip advice can see: from now to the last gameweek with fixtures
 * baked in, and never past the end of the current chip set — a set-one chip
 * unused at the GW19 deadline is gone.
 */
function chipLookahead() {
  const first = currentGw();
  let last = first;
  for (const p of DATA.players) for (const f of p.fixtures) if (f.gw > last) last = f.gw;
  const halfEnd = chipSet(first) === 1 ? RULES.firstHalfLastGw : RULES.lastGw;
  last = Math.min(last, halfEnd);
  return Array.from({ length: Math.max(0, last - first + 1) }, (_, i) => first + i);
}

/** One club's fixture list, taken from any of its players (they all share it). */
const clubFixtures = new Map();
for (const p of DATA.players) if (!clubFixtures.has(p.teamId)) clubFixtures.set(p.teamId, p.fixtures);

/** How many clubs play twice, and how many not at all, in a gameweek. */
function gwShape(gw) {
  let doubles = 0, blanks = 0;
  for (const fixtures of clubFixtures.values()) {
    const n = fixtures.filter(f => f.gw === gw).length;
    if (n >= 2) doubles++;
    if (n === 0) blanks++;
  }
  return { doubles, blanks };
}

/**
 * Minutes a player needs this season before a chip may build a squad around
 * him. A player with no minutes has no evidence behind his figure — it comes
 * from his price and FPL's form number alone — and the Free Hit and Wildcard
 * *maximise* over the pool, so every unassessable player with a flattering
 * guess floats straight to the top. One full match is the bar.
 */
const MIN_POOL_MINUTES = 90;
const evidenced = worth => x => {
  const p = typeof x === "object" ? x : byId.get(x);
  return p.minutes >= MIN_POOL_MINUTES ? worth(p) : 0;
};

/** The best XI a one-off squad from the whole pool could field, on this value. */
function bestPoolXI(worth, budget) {
  const w = evidenced(worth);
  let best = null;
  // A coarser price-penalty sweep than the draft uses: this runs once per week.
  for (let lambda = 0; lambda <= 0.6; lambda += 0.05) {
    const squad = greedyBuild(lambda, w, budget);
    if (!squad) continue;
    const xi = bestXI(squad.map(p => ({ id: p.id })), w);
    if (xi && (!best || xi.ep > best.ep)) best = xi;
  }
  return best;
}

/**
 * What your squad could reach with ordinary transfers: up to `maxSwaps`
 * one-for-one swaps, each the single change that lifts the best XI most,
 * within the bank and the club limit, made one a week. This is the honest
 * baseline for a Wildcard — its value is only what is left *after* the
 * transfers you would have made anyway, not the whole gap to a perfect squad.
 */
function reachableBySwaps(picks, worth, bankNow, maxSwaps, weeks) {
  const w = evidenced(worth);
  let current = picks.map(p => byId.get(p.id));
  let score = squadScore(current, w);
  const start = score;
  let earned = 0;
  let spare = bankNow;
  for (let k = 0; k < maxSwaps; k++) {
    const ids = new Set(current.map(p => p.id));
    const clubs = new Map();
    for (const p of current) clubs.set(p.teamId, (clubs.get(p.teamId) || 0) + 1);
    let best = null;
    for (let i = 0; i < current.length; i++) {
      const out = current[i];
      const affordable = out.price + spare;
      const options = DATA.players
        .filter(c => c.pos === out.pos && !ids.has(c.id) && c.status === "available" &&
          c.price <= affordable && w(c) > 0 &&
          (clubs.get(c.teamId) || 0) + 1 - (c.teamId === out.teamId ? 1 : 0) <= RULES.maxPerClub)
        .sort((a, b) => w(b) - w(a))
        .slice(0, 25);
      for (const cand of options) {
        const trial = current.slice();
        trial[i] = cand;
        const s = squadScore(trial, w);
        if (s > score + 1e-9 && (!best || s > best.s)) best = { s, trial, spend: cand.price - out.price };
      }
    }
    if (!best) break;
    // One free transfer a week: the k-th swap lands in week k and only pays
    // for the weeks after it. That timing is precisely what a Wildcard buys.
    earned += (best.s - score) * Math.max(0, weeks - k) / Math.max(1, weeks);
    current = best.trial;
    score = best.s;
    spare -= best.spend;
  }
  return start + earned;
}

// What a chip has to be worth before the page will tell you to play it.
const CHIP_WORTH = {
  bboost: 12,    // bench points in its best week
  freehit: 10,   // one-week squad's gain over your own XI
  wildcard: 12,  // full rebuild's gain over the whole window
  blankXI: 3,    // starters without a fixture: a Free Hit case on its own
  doubleClubs: 4, // clubs playing twice for a week to count as a double gameweek
  expiry: 3,     // gameweeks before the set ends at which "use it or lose it" kicks in
};

/**
 * Value every chip in every week ahead. Memoised on what it depends on, since
 * the Free Hit and Wildcard figures each build a squad from the pool.
 */
let chipOutlookCache = { key: null, value: null };
function chipOutlook() {
  const gws = chipLookahead();
  const key = [currentGw(), metric, state.picks.map(p => p.id).sort((a, b) => a - b).join(","), bank(), state.freeTransfers].join("|");
  if (chipOutlookCache.key === key) return chipOutlookCache.value;

  const picks = state.picks;
  const budget = squadValue() + bank();

  const weeks = gws.map(gw => {
    const worth = worthIn(gw);
    const xi = bestXI(picks, worth);
    const ids = xi ? xi.ids : new Set();
    const xiEp = xi ? xi.ep : 0;

    let captain = null;
    for (const id of ids) {
      const v = worth(id);
      if (!captain || v > captain.ep) captain = { id, ep: v, fixtures: byId.get(id).fixtures.filter(f => f.gw === gw).length };
    }
    const benchPicks = picks.filter(p => !ids.has(p.id));
    const benchEp = benchPicks.reduce((t, p) => t + worth(p.id), 0);
    const benchDoubles = benchPicks.filter(p => byId.get(p.id).fixtures.filter(f => f.gw === gw).length >= 2).length;
    const xiBlank = [...ids].filter(id => !byId.get(id).fixtures.some(f => f.gw === gw)).length;

    const pool = bestPoolXI(worth, budget);
    const freehit = pool ? Math.max(0, pool.ep - xiEp) : 0;

    return { gw, shape: gwShape(gw), xiEp, captain, benchEp, benchDoubles, xiBlank, freehit };
  });

  // The Wildcard is a permanent rebuild, so it is judged across the window —
  // and against what ordinary transfers would reach over that window, since
  // one free transfer a week closes much of the gap to a perfect squad anyway.
  const over = worthOver(gws);
  const mine = bestXI(picks, over);
  const pool = bestPoolXI(over, budget);
  const freeSwaps = Math.min(RULES.squadSize, Math.max(0, state.freeTransfers) + Math.max(0, gws.length - 1));
  const viaTransfers = mine ? reachableBySwaps(picks, over, bank(), freeSwaps, gws.length) : 0;
  const wildcard = mine && pool ? Math.max(0, pool.ep - Math.max(viaTransfers, mine.ep)) : 0;
  const rebuildGap = mine && pool ? Math.max(0, pool.ep - mine.ep) : 0;
  const unavailable = picks.filter(p => availability(byId.get(p.id)) < 0.5).length;

  const value = { gws, weeks, wildcard, rebuildGap, freeSwaps, unavailable };
  chipOutlookCache = { key, value };
  return value;
}

const argmax = (items, f) => items.reduce((best, x) => (best === null || f(x) > f(best) ? x : best), null);

/**
 * Turn the outlook into one verdict per chip: play it in a given week, or
 * hold — and in either case why, with the number behind it.
 */
function chipVerdicts() {
  const { gws, weeks, wildcard, rebuildGap, freeSwaps, unavailable } = chipOutlook();
  const now = currentGw();
  const set = chipSet(now);
  const setEnd = set === 1 ? RULES.firstHalfLastGw : RULES.lastGw;
  const first = gws[0], last = gws[gws.length - 1];
  const span = first === last ? `GW${first}` : `GW${first}–${last}`;
  const name = id => byId.get(id).name;
  const pts = x => x.toFixed(1);
  const out = {};

  for (const chip of CHIPS) {
    const played = state.chipsUsed[`${set}:${chip.id}`];
    if (played) { out[chip.id] = { verdict: "played", gw: played, why: `Played in GW${played}.` }; continue; }
    if (!weeks.length) { out[chip.id] = { verdict: "hold", why: "No fixtures ahead to judge it on." }; continue; }

    if (chip.id === "3xc") {
      const week = argmax(weeks, w => (w.captain ? w.captain.ep : 0));
      const cap = week.captain;
      if (cap && cap.fixtures >= 2) {
        out[chip.id] = { verdict: "play", gw: week.gw, gain: cap.ep,
          why: `<b>${name(cap.id)}</b> has two fixtures in GW${week.gw} and projects <b>${pts(cap.ep)}</b> — tripling adds that again.` };
      } else {
        out[chip.id] = { verdict: "hold", gw: week.gw, gain: cap ? cap.ep : 0,
          why: `No double gameweek for a captain over ${span}, and that is where this chip pays.` +
               (cap ? ` The best single week is <b>${name(cap.id)}</b> in GW${week.gw} (+${pts(cap.ep)}).` : "") };
      }
    }

    if (chip.id === "bboost") {
      const week = argmax(weeks, w => w.benchEp);
      const dbl = week.benchDoubles ? ` (${week.benchDoubles} of the 4 play twice)` : "";
      out[chip.id] = week.benchEp >= CHIP_WORTH.bboost
        ? { verdict: "play", gw: week.gw, gain: week.benchEp,
            why: `Your bench projects <b>${pts(week.benchEp)}</b> in GW${week.gw}${dbl} — worth boosting.` }
        : { verdict: "hold", gw: week.gw, gain: week.benchEp,
            why: `Your bench projects only <b>${pts(week.benchEp)}</b> in its best week (GW${week.gw})${dbl}. ` +
                 `It needs about ${CHIP_WORTH.bboost} to be worth it — usually a double gameweek, or a stronger bench.` };
    }

    if (chip.id === "freehit") {
      const byGain = argmax(weeks, w => w.freehit);
      const byBlank = argmax(weeks, w => w.xiBlank);
      // A week that empties your XI is the Free Hit case even if a lesser
      // week edges it on raw gain; prefer it unless it is clearly worse.
      // A one-shot chip is for a week whose *shape* demands it: a blank that
      // empties your XI, or a double spread across the league. An ordinary
      // week's paper gain does not qualify, however large — a one-week squad
      // built by maximising over the whole pool is where the projections are
      // least trustworthy, and free transfers close ordinary gaps anyway.
      const byDouble = argmax(weeks, w => w.shape.doubles);
      const blankCase = byBlank.xiBlank >= CHIP_WORTH.blankXI;
      const doubleCase = byDouble.shape.doubles >= CHIP_WORTH.doubleClubs && byDouble.freehit >= CHIP_WORTH.freehit;
      const pick = blankCase ? byBlank : byDouble;
      if (blankCase || doubleCase) {
        const shapeNote = blankCase
          ? `<b>${pick.xiBlank}</b> of your starters have no fixture`
          : `<b>${pick.shape.doubles}</b> clubs play twice`;
        out[chip.id] = { verdict: "play", gw: pick.gw, gain: pick.freehit,
          why: `GW${pick.gw}: ${shapeNote}, and a one-week squad from the pool gains <b>+${pts(pick.freehit)}</b> over your XI.` };
      } else {
        out[chip.id] = { verdict: "hold", gw: byGain.gw, gain: byGain.freehit,
          why: `No blank hits your XI and no double gameweek falls in ${span} — the weeks this chip is for. ` +
               `(On paper a one-week squad gains up to +${pts(byGain.freehit)} in GW${byGain.gw}, but that is an ordinary week, and free transfers close ordinary gaps.)` };
      }
    }

    if (chip.id === "wildcard") {
      const injured = unavailable ? ` ${unavailable} of your 15 ${unavailable === 1 ? "is" : "are"} unlikely to play.` : "";
      const swaps = `${freeSwaps} free transfer${freeSwaps === 1 ? "" : "s"}`;
      out[chip.id] = wildcard >= CHIP_WORTH.wildcard
        ? { verdict: "play", gw: now, gain: wildcard,
            why: `A full rebuild is worth <b>+${pts(wildcard)}</b> over ${span} beyond what your ${swaps} could reach on their own (the whole gap to the best squad is ${pts(rebuildGap)}).${injured}` }
        : { verdict: "hold", gw: now, gain: wildcard,
            why: `Your ${swaps} over ${span} can reach within <b>${pts(wildcard)}</b> of a full rebuild, so the chip adds little now${injured ? "." + injured : "."}` };
    }

    // A chip unused at the end of its set is gone; say so while there is time.
    const left = setEnd - now;
    if (out[chip.id].verdict === "hold" && left <= CHIP_WORTH.expiry) {
      out[chip.id].expiring = true;
      out[chip.id].why += ` <b>Expires after the GW${setEnd} deadline</b> — ` +
        (left === 0 ? "this is the last week to use it." : `${left} gameweek${left === 1 ? "" : "s"} left.`);
    }
  }
  return out;
}

/* =====================================================================
   Gameweek progression — where the transfer rules actually bite
   ===================================================================== */
/**
 * Save the current squad as your team for this gameweek.
 *
 * This settles the transfers — spending free ones, booking any hit — and makes
 * the saved squad the baseline that the next change is measured against. It
 * does *not* move the calendar on. The next gameweek arrives when it actually
 * arrives, and the page picks that up on the next rebuild.
 */
function lockInSquad() {
  if (!isLegal()) return flash("Fix the errors above before saving.");

  const made = transfersMade();
  const hit = hitsTaken();
  if (made === 0 && state.confirmedForGw === currentGw()) {
    return flash("Nothing has changed since you last saved.");
  }
  if (hit > 0 && !confirm(`${made} transfers with ${state.freeTransfers} free.\n\nThis costs ${hit} points. Save anyway?`)) return;

  const gw = currentGw();
  const chip = state.activeChip;
  const wasInitialBuild = !state.confirmed;
  if (chip) state.chipsUsed[`${chipSet(gw)}:${chip}`] = gw;

  // Saving twice in one gameweek adds to that gameweek's entry rather than
  // logging it again: you made more transfers, you did not live through it twice.
  const capName = state.captain ? byId.get(state.captain).name : null;
  const existing = state.history.find(h => h.gw === gw);
  if (existing) {
    existing.transfers += made;
    existing.hit += hit;
    existing.chip = chip || existing.chip;
    existing.value = squadValue();
    existing.captain = capName;
  } else {
    state.history.push({ gw, transfers: made, hit, chip, value: squadValue(), captain: capName });
  }
  state.totalHits = state.history.reduce((t, h) => t + (h.hit || 0), 0);

  // A Free Hit squad stands for this gameweek and reverts at the next one, so
  // that revert is deferred to the calendar rather than done here.
  state.pendingFreeHitRevert = chip === "freehit";
  state.confirmed = state.picks.map(p => ({ ...p }));
  state.confirmedForGw = gw;

  // Free transfers are spent now. The weekly +1 is granted when the calendar
  // actually advances, in syncToCalendar.
  if (!wasInitialBuild && !UNLIMITED_CHIPS.has(chip)) {
    state.freeTransfers = Math.max(0, state.freeTransfers - made);
  }

  normaliseBench();
  render();
  flash(`Saved as your GW${gw} team${hit ? ` — ${hit} point hit booked` : ""}.`);
}

function chipAvailable(chipId) {
  if (state.chipsUsed[`${chipSet(currentGw())}:${chipId}`]) return "Already played in this half of the season.";
  if (state.activeChip && state.activeChip !== chipId) return "Only one chip per gameweek.";
  if (chipId === "freehit" && currentGw() === 1) return "Free Hit cannot be played in Gameweek 1.";
  return null;
}

function toggleChip(chipId) {
  if (state.activeChip === chipId) {
    if (chipId === "freehit" && state.preFreeHit) {
      state.picks = state.preFreeHit.map(p => ({ ...p }));
      state.preFreeHit = null;
    }
    state.activeChip = null;
    return render();
  }
  const why = chipAvailable(chipId);
  if (why) return flash(why);

  // Remember the squad so a Free Hit can be undone or reverted after the week.
  if (chipId === "freehit") state.preFreeHit = state.picks.map(p => ({ ...p }));
  state.activeChip = chipId;
  render();
}

/**
 * Put the current 15 on the clipboard, comma-separated.
 *
 * The page keeps your squad in this browser, so transfers applied here already
 * survive a rebuild. This is for the other direction: pasting the squad back
 * into `config.yaml` so a fresh browser, a cleared cache or a second machine
 * starts from the right team. `squad.players` accepts this format directly.
 */
async function copySquad() {
  if (!state.picks.length) return flash("No squad to copy yet.");
  const names = state.picks.map(p => byId.get(p.id).name).join(", ");

  try {
    await navigator.clipboard.writeText(names);
    flash(`${state.picks.length} names copied — paste into squad.players in config.yaml.`);
  } catch (e) {
    // Clipboard access can be refused; fall back to selecting the text so the
    // viewer can copy it by hand rather than losing it entirely.
    const box = document.createElement("textarea");
    box.value = names;
    box.setAttribute("readonly", "");
    box.style.cssText = "position:fixed;top:12px;left:12px;width:60vw;height:70px;z-index:99";
    document.body.appendChild(box);
    box.select();
    flash("Copy the highlighted text, then click anywhere to dismiss it.");
    const dismiss = () => { box.remove(); document.removeEventListener("click", dismiss); };
    setTimeout(() => document.addEventListener("click", dismiss), 0);
  }
}

function resetAll() {
  const back = presetState();
  const msg = back
    ? `Discard your changes and go back to the squad this page was built with?`
    : `Clear the squad and start again from Gameweek ${DATA.gameweek}?`;
  state = back || freshState();
  selectedPick = null;
  if (back) applyBestXI();
  render();
}

/* =====================================================================
   Live points — only when served by `fpl serve`

   During a gameweek, each player's card shows the points he has scored so
   far once his match is under way, and the ledger keeps a running total for
   the XI. The gameweek shown is the one most recently past its deadline —
   in play over the weekend, final by the time the next deadline comes round.
   A browser cannot ask FPL for this itself, so the helper fetches it.
   ===================================================================== */
let live = null;   // { gw, points: {id: [pts, mins]}, byTeam: {teamId: status} }

/** The gameweek being played (or just finished): the last one past its deadline. */
const liveGw = () => currentGw() - 1;

async function loadLive() {
  if (!SERVER || liveGw() < 1) return;
  try {
    const res = await fetch(`/api/live?gw=${liveGw()}`, { cache: "no-store" });
    const data = await res.json();
    if (!res.ok || !data.ok) return;
    // A club's match state, from its fixtures that week (two in a double).
    const byTeam = {};
    for (const f of data.fixtures) {
      for (const t of [f.h, f.a]) {
        const cur = byTeam[t] || { started: 0, finished: 0, total: 0 };
        cur.total++; if (f.started) cur.started++; if (f.finished) cur.finished++;
        byTeam[t] = cur;
      }
    }
    const status = {};
    for (const [t, c] of Object.entries(byTeam)) {
      status[t] = c.total && c.finished === c.total ? "final" : c.started ? "live" : "upcoming";
    }
    live = { gw: data.gw, points: data.points, byTeam: status };
    renderPitch();
    renderLedger();
  } catch (e) { /* helper not there, or FPL not answering: the page simply shows no points */ }
}

/** Points so far for a player, or null if his match has not kicked off. */
function livePointsFor(id) {
  if (!live) return null;
  const p = byId.get(id);
  const status = live.byTeam[String(p.teamId)] || "upcoming";
  if (status === "upcoming") return null;
  const [pts, mins] = live.points[String(id)] || [0, 0];
  return { pts, mins, status };
}

/** The XI's running total, captain doubled (tripled under a Triple Captain). */
function liveTotal() {
  if (!live) return null;
  const played = state.history.find(h => h.gw === live.gw);
  const chip = played ? played.chip : null;
  const capMult = chip === "3xc" ? 3 : 2;
  const counted = chip === "bboost" ? state.picks : starters();
  let total = 0, seen = 0;
  for (const p of counted) {
    const lp = livePointsFor(p.id);
    if (!lp) continue;
    seen++;
    total += lp.pts * (p.id === state.captain ? capMult : 1);
  }
  return { total, seen, of: counted.length, final: counted.every(p => (livePointsFor(p.id) || {}).status === "final") };
}

/* =====================================================================
   Saving to config.local.yaml — only when served by `fpl serve`
   ===================================================================== */
/**
 * Opened as a file, a page cannot write to disk, so the squad could only
 * reach `config.local.yaml` by way of "Copy squad" and a paste. Served by
 * `fpl serve` the page can ask the helper to write it instead.
 *
 * Whether that file exists is how the page tells a first visit from a
 * returning one: absent, it asks for a team and a bank; present, both are
 * pre-filled and "Save team" simply updates them after transfers.
 */
const SERVER = /^https?:$/.test(location.protocol);
let configExists = null;   // null until the helper has answered (or cannot)

/**
 * Set the real bank. It cannot be read off today's prices — it depends on what
 * you paid — so the difference is carried as realised profit, exactly as a
 * build-time `bank` is, and `bank()` comes out at the figure you typed.
 */
function applyBank(tenths) {
  const paid = state.picks.reduce((t, p) => t + p.buyPrice, 0);
  state.realised = tenths - (RULES.budget - paid);
}

function renderSetup() {
  const box = el("setup");
  if (!SERVER || configExists === null) { box.hidden = true; return; }
  box.hidden = false;
  el("setupMsg").innerHTML = state.imported
    ? `Your team comes from FPL team <b>${state.imported.teamId}</b> each time the page is built.
       Free transfers are worked out from your transfer history — correct them here if FPL shows otherwise.`
    : configExists
      ? `Your team is saved in <code>config.local.yaml</code>. Save again after you make transfers — or
         import it from FPL with your team ID.`
      : `<b>First time here?</b> Enter your FPL team ID — the number in your team's web address — and
         press Import: your squad, bank and chips come straight from FPL. Or pick your 15 below.`;
}

async function loadConfig() {
  if (!SERVER) return;
  try {
    const res = await fetch("/api/config", { cache: "no-store" });
    const info = await res.json();
    configExists = !!info.exists;
    const squad = info.squad || {};
    // Pre-fill from the file when there is one; otherwise from what the
    // current squad implies, which is the best guess a new visitor has.
    // An imported team's own figures beat whatever was last typed into the file.
    el("setupBank").value = state.imported || squad.bank == null ? money(bank()) : Number(squad.bank).toFixed(1);
    el("setupFt").value = state.imported || squad.free_transfers == null ? state.freeTransfers : squad.free_transfers;
    el("setupTeam").value = squad.team_id ?? state.imported?.teamId ?? "";
  } catch (e) {
    configExists = null;   // no helper behind this page; keep the strip hidden
  }
  renderSetup();
}

function readBankField() {
  const v = Number(el("setupBank").value);
  return Number.isFinite(v) && v >= 0 ? v : null;
}
function readFtField() {
  const v = Number(el("setupFt").value);
  return Number.isInteger(v) && v >= 0 && v <= 5 ? v : null;
}

async function saveConfig() {
  if (state.picks.length !== RULES.squadSize) {
    return flash(`Pick all ${RULES.squadSize} players before saving your team.`);
  }
  const bankM = readBankField();
  if (bankM === null) return flash("Enter your bank in millions, e.g. 0.3.");
  const ft = readFtField();
  if (ft === null) return flash("Free transfers must be a whole number from 0 to 5.");

  const nameOf = id => (id && byId.has(id)) ? byId.get(id).name : null;
  const payload = {
    players: state.picks.map(p => byId.get(p.id).name),
    captain: nameOf(state.captain),
    vice: nameOf(state.vice),
    bank: bankM,
    free_transfers: ft,
  };
  const teamId = el("setupTeam").value.trim();
  if (/^\d+$/.test(teamId)) payload.team_id = Number(teamId);

  let out;
  try {
    const res = await fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    out = await res.json();
    if (!res.ok || !out.ok) return flash(`Could not save: ${out.error || res.statusText}.`);
  } catch (e) {
    return flash("Could not reach the local helper — is `fpl serve` still running?");
  }

  // Make the page agree with what was just written.
  applyBank(Math.round(bankM * 10));
  state.freeTransfers = ft;
  configExists = true;
  save();
  renderSetup();
  render();
  flash("Saved to config.local.yaml.");
}

/**
 * Import the real team now, through the helper: the same import a build does
 * when `squad.team_id` is set, so the page does not have to be rebuilt first.
 * It can be undone like any other change, and the id is saved so every later
 * build imports it.
 */
async function importTeam() {
  const raw = el("setupTeam").value.trim();
  if (!/^\d+$/.test(raw)) {
    return flash("Your team ID is the number in your FPL team's web address: …/entry/1234567/event/7.");
  }
  const btn = el("importTeam");
  btn.disabled = true;
  btn.textContent = "Importing…";
  try {
    const res = await fetch(`/api/entry?team_id=${raw}`, { cache: "no-store" });
    const out = await res.json();
    if (!res.ok || !out.ok) return flash(out.error || "FPL did not answer.");
    const imported = stateFromTeam(teamFromEntry(out.team));
    if (!imported) return flash("That team has a player this page does not know — run fpl serve again, then import.");
    withUndo(`Imported ${out.team.name}, as it stood at the GW${out.team.gw} deadline`, () => {
      state = imported;
      selectedPick = null;
      applyBestXI();
      render();
    });
    el("setupBank").value = money(bank());
    el("setupFt").value = state.freeTransfers;
    fetch("/api/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ team_id: Number(raw) }),
    }).then(r => { if (r.ok) { configExists = true; renderSetup(); } }).catch(() => {});
  } catch (e) {
    flash("Could not reach the local helper — is `fpl serve` still running?");
  } finally {
    btn.disabled = false;
    btn.textContent = "Import";
  }
}

/* =====================================================================
   Render
   ===================================================================== */
const el = id => document.getElementById(id);

/* =====================================================================
   Feedback: toasts, undo, and the tray

   Every change to the squad can be taken back. A change is a snapshot of the
   whole state taken before it, so undo is exact — transfers, armbands, bench
   order, chips, even a save — and no action needs an "are you sure?".
   ===================================================================== */
const TOAST_MS = 6000;
const MAX_TOASTS = 3;

function toast(msg, { undo = false, tone = "" } = {}) {
  const box = el("toasts");
  const node = document.createElement("div");
  node.className = `toast ${tone}`;
  node.innerHTML = `<span class="msg"></span>${undo ? `<button type="button" data-undo>Undo</button>` : ""}`;
  node.querySelector(".msg").textContent = msg;
  box.appendChild(node);
  while (box.children.length > MAX_TOASTS) box.firstElementChild.remove();
  const leave = () => {
    if (!node.isConnected) return;
    node.classList.add("leaving");
    setTimeout(() => node.remove(), 200);
  };
  setTimeout(leave, TOAST_MS);
  return node;
}

/** A refusal or a hint: same toast, in amber, with nothing to undo. */
function flash(msg) {
  toast(msg, { tone: "warn" });
}

const undoStack = [];
const MAX_UNDO = 40;

/**
 * Run a change so it can be undone: snapshot first, toast after. A refused
 * or empty change (the state comes out identical) leaves no trace, and cards
 * that just arrived in the squad get a moment's highlight.
 */
function withUndo(label, change) {
  const before = JSON.stringify(state);
  const had = new Set(state.picks.map(p => p.id));
  change();
  if (JSON.stringify(state) === before) return;
  const text = typeof label === "function" ? label() : label;
  undoStack.push({ label: text, snap: before });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  for (const p of state.picks) {
    if (!had.has(p.id)) document.querySelectorAll(`.card[data-pick="${p.id}"]`).forEach(c => c.classList.add("is-new"));
  }
  renderTray();
  toast(text, { undo: true });
}

function undo() {
  const last = undoStack.pop();
  if (!last) return flash("Nothing to undo.");
  state = JSON.parse(last.snap);
  selectedPick = null;
  render();
  toast(`Undone: ${last.label}`);
}

/** This week's transfers as out → in pairs, matched by position where they can be. */
function pendingTransfers() {
  if (!state.confirmed) return null;
  const now = new Set(state.picks.map(p => p.id));
  const before = new Set(state.confirmed.map(p => p.id));
  const outs = state.confirmed.filter(p => !now.has(p.id)).map(p => byId.get(p.id));
  const ins = state.picks.filter(p => !before.has(p.id)).map(p => byId.get(p.id));
  const pairs = [];
  for (const o of outs) {
    const i = ins.findIndex(x => x.pos === o.pos);
    pairs.push([o, i >= 0 ? ins.splice(i, 1)[0] : null]);
  }
  for (const i of ins) pairs.push([null, i]);
  return pairs;
}

function renderTray() {
  const pairs = pendingTransfers();
  const made = transfersMade();
  const hit = hitsTaken();
  const chip = CHIPS.find(c => c.id === state.activeChip);
  const gw = currentGw();
  const box = el("trayChanges");

  if (!pairs) {
    box.innerHTML = state.picks.length < RULES.squadSize
      ? `<span class="lbl">Squad</span> Building your XV — <b>${state.picks.length} of ${RULES.squadSize}</b> picked`
      : `<span class="lbl">Squad</span> All ${RULES.squadSize} picked. Save it as your GW${gw} team, and transfers count from there.`;
  } else if (!pairs.length) {
    box.innerHTML = `<span class="lbl">This week</span> <span class="quiet">${
      state.confirmedForGw === gw ? `Saved for GW${gw} — no changes since.` : `No transfers yet for GW${gw}.`}</span>`;
  } else {
    box.innerHTML = `<span class="lbl">This week</span>` + pairs.map(([o, i]) =>
      `<span class="xfer">${o ? `<span class="out">${o.name}</span>` : ""}${o && i ? `<span class="arr">→</span>` : ""}${
        i ? `<span class="in">${i.name}</span>` : ""}</span>`).join("");
  }

  const unlimited = UNLIMITED_CHIPS.has(state.activeChip);
  const parts = [];
  if (pairs) parts.push(unlimited ? `<b>${made}</b> free under ${chip.name}` : `<b>${made}</b> of ${state.freeTransfers} free`);
  if (hit) parts.push(`<span class="hit">−${hit} pts</span>`);
  if (chip) parts.push(`<span class="chipon">${chip.name}</span>`);
  el("trayCost").innerHTML = parts.join(" · ");

  el("undo").disabled = !undoStack.length;
  el("tray").classList.toggle("has-changes", made > 0 || !!chip);
}

/* ------------------------------------------------------------------ tabs */
const TABS = ["transfers", "chips", "fixtures", "record"];
let activeTab = (() => {
  try { return TABS.includes(localStorage.getItem("fpl-tab")) ? localStorage.getItem("fpl-tab") : "transfers"; }
  catch (e) { return "transfers"; }
})();

function showTab(name) {
  if (!TABS.includes(name)) return;
  activeTab = name;
  try { localStorage.setItem("fpl-tab", name); } catch (e) { /* a private window: the tab just is not remembered */ }
  document.querySelectorAll(".worktab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  document.querySelectorAll(".workpane").forEach(p => { p.hidden = p.dataset.pane !== name; });
}

function renderLedger() {
  const made = transfersMade();
  const hit = hitsTaken();
  const free = state.freeTransfers;
  const chip = CHIPS.find(c => c.id === state.activeChip);

  const stats = [
    { k: "Bank", v: "£" + money(bank()) + "m", cls: bank() < 0 ? "is-danger" : "" },
    { k: "Squad value", v: "£" + money(squadValue()) + "m" },
    { k: "Free transfers", v: UNLIMITED_CHIPS.has(state.activeChip) ? "∞" : `${free}`, cls: UNLIMITED_CHIPS.has(state.activeChip) ? "is-good" : "" },
    { k: "Transfers", v: `${made}`, cls: made > free && !UNLIMITED_CHIPS.has(state.activeChip) ? "is-warn" : "" },
    { k: "Points hit", v: hit ? `−${hit}` : "0", cls: hit ? "is-danger" : "" },
    { k: "Chip", v: chip ? chip.name : "—", cls: chip ? "is-good" : "" },
  ];
  const lt = liveTotal();
  if (lt && lt.seen) {
    stats.push({
      k: lt.final ? `GW${live.gw} final` : `GW${live.gw} so far`,
      v: `${lt.total}`,
      cls: lt.final ? "" : "is-good",
      title: `${lt.seen} of ${lt.of} have played — captain counted double`,
    });
  }

  // A figure that moved since the last render bumps, so a transfer's effect on
  // the bank or the hit is seen as well as read. Not on the first render.
  const bumped = s => lastLedger !== null && lastLedger[s.k] !== undefined && lastLedger[s.k] !== s.v;
  el("ledger").innerHTML = stats.map(s =>
    `<div class="stat ${s.cls || ""} ${bumped(s) ? "bump" : ""}"${s.title ? ` title="${s.title}"` : ""}><span class="k">${s.k}</span><span class="v">${s.v}</span></div>`
  ).join("");
  lastLedger = Object.fromEntries(stats.map(s => [s.k, s.v]));
}
let lastLedger = null;

/**
 * This gameweek's fixture only — usually one chip, two in a double, none in a
 * blank. A squad card showing the whole run as chips is a wall of them, so the
 * gameweeks after this one go in the compact strip below it (`nextRunHTML`).
 */
function fixtureText(player) {
  const now = player.fixtures.filter(f => f.gw === currentGw());
  if (!now.length) return `<span class="fdr fdr-3">BLANK</span>`;
  return now.map(f =>
    `<span class="fdr fdr-${tierOf(f)}" title="${fixtureTitle(f)}">${f.opp} ${f.home ? "(H)" : "(A)"}</span>`
  ).join(" ");
}

/** The last gameweek the page has fixtures for: past it, no fixture means unknown, not a blank. */
const fixturesThrough = () =>
  DATA.fixturesThrough ?? DATA.gameweek + Math.max(1, Number(DATA.horizon) || 5) + 3;

/**
 * The four gameweeks after this one, one small cell each: home in capitals,
 * away in lower case. A double shows ×2 in its easier fixture's colour, with
 * both fixtures in the tooltip; a blank is a dash.
 */
function nextRunHTML(p) {
  const cells = [];
  for (let gw = currentGw() + 1; gw <= Math.min(currentGw() + 4, RULES.lastGw); gw++) {
    const fx = p.fixtures.filter(f => f.gw === gw);
    if (!fx.length) {
      if (gw <= fixturesThrough()) cells.push(`<span class="blank" title="GW${gw}: blank">—</span>`);
      continue;
    }
    const title = fx.map(fixtureTitle).join(" · ");
    if (fx.length > 1) {
      const easiest = Math.min(...fx.map(tierOf));
      cells.push(`<span class="fdr-${easiest}" title="${title}">×${fx.length}</span>`);
    } else {
      const f = fx[0];
      cells.push(`<span class="fdr-${tierOf(f)}" title="${title}">${f.home ? f.opp.toUpperCase() : f.opp.toLowerCase()}</span>`);
    }
  }
  return cells.join("");
}

/*
 * Whether he will play, in a word. FPL's own flag comes first; for a player
 * it calls fit, the minutes model's view. The ROT line is under 60% to last an
 * hour, which catches the regulars most often rested or hooked early without
 * flagging every forward who usually comes off around 75 minutes.
 */
const ROTATION_P60 = 0.6;
const BENCH_P_PLAY = 0.3;
const STATUS_SHORT = { injured: "INJ", suspended: "SUS", unavailable: "OUT", ineligible: "N/A" };

// Not `availability`: that name is the projections' chance of being available
// (a number), and a second declaration silently replaces the first — which
// once left every transfer candidate failing `availability(c) > 0`.
function availabilityBadge(p) {
  const pct = x => `${Math.round(x * 100)}%`;
  if (p.status === "doubtful") {
    return { cls: "doubtful", text: p.chance !== null ? `${p.chance}%` : "?",
      title: `Doubtful${p.chance !== null ? ` — ${p.chance}% chance of playing` : ""}` };
  }
  if (p.status !== "available") {
    return { cls: "out", text: STATUS_SHORT[p.status] || "OUT",
      title: `${p.status[0].toUpperCase()}${p.status.slice(1)}${p.chance !== null ? ` — ${p.chance}% chance of playing` : ""}` };
  }
  const w = p.why;
  if (!w) return null;
  if (w.p_play < BENCH_P_PLAY) {
    return { cls: "rot", text: "BENCH", title: `Rarely plays — ${pct(w.p_play)} to play at all` };
  }
  if (w.p_60 < ROTATION_P60) {
    return { cls: "rot", text: "ROT", title: `Rotation risk — ${pct(w.p_play)} to play, ${pct(w.p_60)} to play 60+ minutes` };
  }
  return null;
}

const availabilityPill = a => (a ? `<span class="pill ${a.cls}" title="${a.title}">${a.text}</span>` : "");

 * stripes for the striped sides. A side not listed — a club promoted after

  CRY: { stripes: ["#1b458f", "#c4122e"], sleeves: "#1b458f", trim: "#ffffff" },
  EVE: { body: "#003399", sleeves: "#003399", trim: "#ffffff" },
  FUL: { body: "#f5f5f5", sleeves: "#f5f5f5", trim: "#111111" },
