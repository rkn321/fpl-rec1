    </div>
    <div class="delta">
      <div class="g">+${move.gain.toFixed(1)}</div>
      ${hitForNextTransfer() > 0
        ? `<div class="cost" style="color:var(--danger)">${(move.gain - hitForNextTransfer()).toFixed(1)} after −${hitForNextTransfer()}</div>`
        : ""}
      <div class="cost">${cost}</div>
      <div class="apply"><button class="btn" data-move="${move.outId}:${move.inId}">Apply</button></div>
    </div>
  </div>`;
}

function staleHTML() {
  if (!dataIsStale()) return "";
  const behind = currentGw() - DATA.gameweek;
  return `<div class="notice warn" style="margin:11px 14px">
    <span>The GW${DATA.gameweek} deadline has passed, so this is now GW${currentGw()}.
    Your transfers and chips have rolled over, but the prices and projections on
    this page are ${behind} gameweek${behind === 1 ? "" : "s"} old.
    Rebuild with <code>fpl export-frontend</code> for current numbers.</span></div>`;
}

function renderAdvice() {
  const box = el("advice");

  if (state.picks.length !== RULES.squadSize) {
    box.innerHTML = staleHTML() + `<div class="empty">Fill all 15 places to get transfer suggestions.</div>`;
    return;
  }

  const moves = singleMoves(6);
  const best = moves[0];
  const gws = horizonGws();
  // "GW3-3" is not a range; a single gameweek is just that gameweek.
  const window = gws.length > 1
    ? `GW${gws[0]}–${gws[gws.length - 1]}`
    : `GW${gws[0] ?? DATA.gameweek}`;
  // And a per-week figure only says something when there is more than one week.
  const weekly = g => (horizon > 1 ? ` (${perGw(g).toFixed(1)} a week)` : "");

  // What one more transfer actually costs right now. With the free one already
  // spent this is 4 points, and a gain has to clear that before it is a gain at
  // all — comparing the gross number against the threshold recommends moves
  // that lose points.
  const nextHit = hitForNextTransfer();
  const net = best ? best.gain - nextHit : 0;

  // What holding actually banks. Saying "two next week" assumed you had one in
  // hand — with the free transfer already spent on a hit, holding gets you one.
  const nextWeekFts = Math.min(
    RULES.maxRolledTransfers,
    Math.max(0, state.freeTransfers - transfersMade()) + RULES.freeTransfersPerGw
  );
  const ftPhrase = `${nextWeekFts} free transfer${nextWeekFts === 1 ? "" : "s"}`;

  let verdict;
  if (!best) {
    verdict = `<div class="verdict hold"><span class="head">Roll it</span>
      <span class="why">Nothing in your price range improves this squad over ${window}.
      Bank it and you start GW${currentGw() + 1} with ${ftPhrase}.</span></div>`;
  } else if (nextHit > 0 && net <= 0) {
    verdict = `<div class="verdict hold"><span class="head">You are done</span>
      <span class="why">No free transfer left, so another move costs
      <b>${nextHit} points</b>. The best one available gains
      <b>+${best.gain.toFixed(1)}</b> over ${window}, which nets
      <b>${net.toFixed(1)}</b> — it loses you points. Leave it, and you get
      ${ftPhrase} for GW${currentGw() + 1}.</span></div>`;
  } else if (nextHit > 0) {
    verdict = `<div class="verdict go"><span class="head">Only with a hit</span>
      <span class="why"><b>${byId.get(best.outId).name} → ${byId.get(best.inId).name}</b>
      gains <b>+${best.gain.toFixed(1)}</b> over ${window} but costs ${nextHit} points,
      netting <b>+${net.toFixed(1)}</b>. Worth it only if you believe the numbers —
      one gameweek of evidence is thin.</span></div>`;
  } else if (best.gain < WORTH_A_TRANSFER) {
    verdict = `<div class="verdict hold"><span class="head">Probably roll it</span>
      <span class="why">The best move on the board is worth about
      <b>+${best.gain.toFixed(1)} pts</b> across ${window}${weekly(best.gain)}.
      That is inside the noise. Holding gives you ${ftPhrase} next week and more
      information.</span></div>`;
  } else {
    verdict = `<div class="verdict go"><span class="head">Use it</span>
      <span class="why"><b>${byId.get(best.outId).name} → ${byId.get(best.inId).name}</b>
      is worth about <b>+${best.gain.toFixed(1)} pts</b> over ${window}${weekly(best.gain)}
      and fits your £${money(bank())}m bank.</span></div>`;
  }

  const list = moves.length
    ? `<div class="moves">${moves.map((m, i) => moveHTML(m, i === 0)).join("")}</div>`
    : "";

  const pairs = pairMoves(3).filter(p => p.gain - p.hit > 0);
  const pairsHTML = pairs.length
    ? `<div class="pairs"><div class="lbl">Two transfers — second one costs ${RULES.hitCost} points</div>` +
      pairs.map(p => {
        const net = p.gain - p.hit;
        return `<div class="pair">
          <span class="net ${net > 0 ? "good" : "bad"}">${net > 0 ? "+" : ""}${net.toFixed(1)} pts net</span>
          <span style="color:var(--ink-faint)"> (+${p.gain.toFixed(1)} gross${p.hit ? `, −${p.hit} hit` : ""})</span>
          <div class="legs">${byId.get(p.first.outId).name} → ${byId.get(p.first.inId).name}
            &nbsp;·&nbsp; ${byId.get(p.second.outId).name} → ${byId.get(p.second.inId).name}</div>
        </div>`;
      }).join("") + `</div>`
    : "";

  box.innerHTML = staleHTML() + verdict + list + pairsHTML;
}

function renderArmbands() {
  const entry = (mark, id, cls) => {
    const p = id ? byId.get(id) : null;
    const fixture = p ? fixturesInHorizon(p).filter(f => f.gw === currentGw()) : [];
    const where = fixture.length
      ? fixture.map(f => `${f.opp} ${f.home ? "(H)" : "(A)"}`).join(", ")
      : "no fixture";
    return `<div class="armband ${cls}" title="${p ? `${p.name} — ${where}` : "not set"}">
      <span class="mark">${mark}</span>
      ${p ? `<span class="who">${p.name}</span>` : `<span class="none">not set</span>`}
    </div>`;
  };
  el("armbands").innerHTML =
    entry("C", state.captain, "captain") + entry("V", state.vice, "vice");
}

function renderNotices() {
  el("notices").innerHTML = validate().map(v =>
    `<div class="notice ${v.level === "err" ? "err" : v.level === "ok" ? "ok" : "warn"}">${v.msg}</div>`
  ).join("");
}

function renderChips() {
  const set = chipSet(currentGw());
  const head = `<div class="lbl">Chips — set ${set} (${set === 1 ? "gameweeks 1–19" : "gameweeks 20–38"}), one per gameweek</div>`;
  el("chipbar").innerHTML = head + CHIPS.map(c => {
    const spent = state.chipsUsed[`${set}:${c.id}`];
    const active = state.activeChip === c.id;
    const why = chipAvailable(c.id);
    const cls = ["chip"];
    if (active) cls.push("is-active");
    if (spent) cls.push("is-spent");
    return `<button class="${cls.join(" ")}" data-chip="${c.id}" ${spent || (why && !active) ? "disabled" : ""}
      title="${spent ? `Played in GW${spent}` : (why || c.note)}"><span class="dot"></span>${c.name}</button>`;
  }).join("");
}

function renderLog() {
  if (!state.history.length) {
    el("log").innerHTML = `<span style="color:var(--ink-faint)">Saving records your transfers and settles the hit. The gameweek itself follows the real FPL calendar — rebuild after the deadline to move to GW${currentGw() + 1}.</span>`;
    return;
  }
  const rows = state.history.slice(-8).reverse().map(h =>
    `<li>GW${h.gw}: ${h.transfers} transfer${h.transfers === 1 ? "" : "s"}` +
    (h.hit ? `, <b style="color:var(--danger)">−${h.hit} pts</b>` : "") +
    (h.chip ? `, ${CHIPS.find(c => c.id === h.chip).name}` : "") +
    (h.captain ? `, captain ${h.captain}` : "") + `</li>`
  ).join("");
  el("log").innerHTML = `<ol>${rows}</ol>` +
    (state.totalHits ? `<div style="margin-top:6px">Total taken in hits: <b style="color:var(--danger)">−${state.totalHits} pts</b></div>` : "");
}

const COLUMNS = [
  { key: "name", label: "Player", sortable: true },
  { key: "fix", label: "Fixture", sortable: false },
  { key: "price", label: "£", sortable: true },
  { key: "ep", label: "Model", sortable: true },
  { key: "epFpl", label: "FPL", sortable: true },
  { key: "ppg", label: "PPG", sortable: true },
  { key: "owned", label: "TSB%", sortable: true },
  { key: "add", label: "", sortable: false },
];

function renderPool() {
  el("poolHead").innerHTML = COLUMNS.map(c =>
    `<th data-sort="${c.sortable ? c.key : ""}" class="${sort.key === c.key ? "is-sorted" : ""}">${c.label}${
      c.sortable && sort.key === c.key ? (sort.dir < 0 ? " ↓" : " ↑") : ""}</th>`
  ).join("");

  const q = filters.search.trim().toLowerCase();
  let rows = DATA.players.filter(p => {
    if (filters.pos !== "ALL" && p.pos !== filters.pos) return false;
    if (filters.team !== "ALL" && String(p.teamId) !== filters.team) return false;
    if (filters.avail === "fit" && p.status !== "available") return false;
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    return true;
  });

  rows.sort((a, b) => {
    const k = sort.key;
    const va = k === "name" ? a.name.toLowerCase() : a[k];
    const vb = k === "name" ? b.name.toLowerCase() : b[k];
    if (va < vb) return -sort.dir;
    if (va > vb) return sort.dir;
    return 0;
  });

  el("poolCount").textContent = `${rows.length} shown`;

  if (!rows.length) {
    el("poolBody").innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty">No players match those filters.</td></tr>`;
    return;
  }

  el("poolBody").innerHTML = rows.slice(0, 250).map(p => {
    const owned = !!pickOf(p.id);
    const why = owned ? "In your squad" : canAdd(p);
    const flag = p.status === "available" ? "" :
      `<span class="flag ${p.status === "doubtful" ? "doubtful" : "out"}" title="${p.status}${p.chance !== null ? ` — ${p.chance}% chance` : ""}"></span>`;
    return `<tr class="${owned ? "is-owned" : ""}">
      <td><div class="p-name">${p.name}${flag}</div><div class="p-sub">${p.team} · ${p.pos}</div></td>
      <td>${fixtureText(p)}</td>
      <td class="num">${money(p.price)}</td>
      <td class="num" ${metric === "ep" ? 'style="color:var(--accent);font-weight:600"' : ""}>${p.ep.toFixed(1)}</td>
      <td class="num" ${metric === "epFpl" ? 'style="color:var(--accent);font-weight:600"' : ""}>${p.epFpl.toFixed(1)}</td>
      <td class="num" ${metric === "ppg" ? 'style="color:var(--accent);font-weight:600"' : ""}>${p.ppg.toFixed(1)}</td>
      <td class="num">${p.owned.toFixed(1)}</td>
      <td>${owned
        ? `<button class="add" data-remove="${p.id}" title="Remove from squad" style="color:var(--danger)">−</button>`
        : `<button class="add" data-add="${p.id}" ${why ? "disabled" : ""} title="${why || "Add to squad"}">+</button>`}</td>
    </tr>`;
  }).join("");
}

function render() {
  save();
  renderLedger();
  renderAdvice();
  renderArmbands();
  renderNotices();
  renderPitch();
  renderChips();
  renderLog();
  renderPool();
  el("confirm").disabled = !isLegal();
  el("confirm").textContent = state.confirmedForGw === currentGw()
    ? `Saved for GW${currentGw()}`
    : `Save as my GW${currentGw()} team`;
  el("gwLabel").textContent = `GW${currentGw()}`;

  const deadline = currentDeadline();
  el("deadline").textContent = deadline
    ? `deadline ${deadline.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`
    : "";
}

/* =====================================================================
   Wiring
   ===================================================================== */
function initChrome() {
  // Every horizon up to the one the page was built with, not a sparse 1/3/5:
  // the interesting comparison is often one step, and skipping 2 and 4 hides it.
  const maxHorizon = Math.max(1, Number(DATA.horizon) || 5);
  el("horizon").innerHTML = Array.from({ length: maxHorizon }, (_, i) => i + 1)
    .map(h => `<option value="${h}" ${horizon === h ? "selected" : ""}>${h === 1 ? "1 gameweek" : h + " gameweeks"}</option>`)
    .join("");

  el("metric").innerHTML = METRICS.map(m =>
    `<option value="${m.key}" ${metric === m.key ? "selected" : ""}>${m.label}</option>`).join("");

  el("posTabs").innerHTML = ["ALL", ...POSITIONS].map(p =>
    `<button class="tab ${filters.pos === p ? "is-on" : ""}" data-pos="${p}">${p === "ALL" ? "All" : p}</button>`
  ).join("");

  el("teamFilter").innerHTML = `<option value="ALL">All clubs</option>` +
    DATA.teams.map(t => `<option value="${t.id}">${t.short}</option>`).join("");

  el("foot").innerHTML =
    `<p style="margin:0 0 6px"><b>Model</b> xPts comes from the <code>${DATA.model}</code> baseline; ` +
    `<b>FPL</b> xPts is the game's own figure. Ranking, sorting and auto-pick all follow whichever you select. ` +
    `In the project's walk-forward backtest the FPL figure ordered players better within position ` +
    `(Spearman 0.69 against 0.40), and the baseline is weakest of all in the opening weeks — with only ` +
    `${DATA.gameweek - 1} gameweek${DATA.gameweek === 2 ? "" : "s"} played it reads cheap over-performers as elite. ` +
    `It is here to be compared against, not trusted yet.</p>` +
    `<p style="margin:0">GW${DATA.gameweek}, ${DATA.season}. Prices and fixtures captured ` +
    `${new Date(DATA.generatedAt).toLocaleDateString()} — rebuild with <code>python -m src.cli export-frontend</code> ` +
    `before each deadline. Your squad is saved in this browser only.</p>`;
}

document.addEventListener("click", e => {
  const t = e.target;

  const add = t.closest("[data-add]");
  if (add) return addPlayer(Number(add.dataset.add));

  const rm = t.closest("[data-remove]");
  if (rm) { e.stopPropagation(); return removePlayer(Number(rm.dataset.remove)); }

  const cap = t.closest("[data-cap]");
  if (cap) {
    e.stopPropagation();
    const id = Number(cap.dataset.cap);
    if (state.vice === id) state.vice = state.captain;
    state.captain = state.captain === id ? null : id;
    return render();
  }

  const vice = t.closest("[data-vice]");
  if (vice) {
    e.stopPropagation();
    const id = Number(vice.dataset.vice);
    if (state.captain === id) state.captain = state.vice;
    state.vice = state.vice === id ? null : id;
    return render();
  }

  const mv = t.closest("[data-move]");
  if (mv) {
    const [outId, inId] = mv.dataset.move.split(":").map(Number);
    return applyMove({ outId, inId });
  }

  const chip = t.closest("[data-chip]");
  if (chip && !chip.disabled) return toggleChip(chip.dataset.chip);

  const slot = t.closest("[data-slot]");
  if (slot) { filters.pos = slot.dataset.slot; initChrome(); return render(); }

  const card = t.closest("[data-pick]");
  if (card) {
    const id = Number(card.dataset.pick);
    if (selectedPick === null) selectedPick = id;
    else if (selectedPick === id) selectedPick = null;
    else return attemptSwap(selectedPick, id);
    return render();
  }

  const tab = t.closest("[data-pos]");
  if (tab && tab.classList.contains("tab")) { filters.pos = tab.dataset.pos; initChrome(); return render(); }

  const th = t.closest("th[data-sort]");
  if (th && th.dataset.sort) {
    const k = th.dataset.sort;
    sort = { key: k, dir: sort.key === k ? -sort.dir : (k === "name" ? 1 : -1) };
    return renderPool();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && selectedPick !== null) { selectedPick = null; render(); }
  if (e.key === "Enter" || e.key === " ") {
    const card = e.target.closest?.("[data-pick]");
    if (card) { e.preventDefault(); card.click(); }
  }
});

el("search").addEventListener("input", e => { filters.search = e.target.value; renderPool(); });
el("teamFilter").addEventListener("change", e => { filters.team = e.target.value; renderPool(); });
el("availFilter").addEventListener("change", e => { filters.avail = e.target.value; renderPool(); });
el("horizon").addEventListener("change", e => { horizon = Number(e.target.value); render(); });
el("metric").addEventListener("change", e => {
  metric = e.target.value;
  if (["ep", "epFpl", "ppg"].includes(sort.key)) sort = { key: metric === "form" ? "ep" : metric, dir: -1 };
  render();
});
el("copySquad").addEventListener("click", copySquad);
el("autoSquad").addEventListener("click", autoPickSquad);
el("confirm").addEventListener("click", lockInSquad);
el("reset").addEventListener("click", resetAll);

initChrome();
if (startedFromPreset) applyBestXI();   // gives the loaded squad a legal XI and a captain
render();

// A page left open over a Friday evening should not still be showing last
// week. Cheap enough to poll: it only does work when the gameweek changes.
let renderedGw = currentGw();
setInterval(() => {
  const live = currentGw();
  if (live === renderedGw) return;
  renderedGw = live;
  syncToCalendar();
  render();
  flash(`The GW${live - 1} deadline has passed — now planning GW${live}.`);
}, 60_000);
</script>
