const KIT_UNKNOWN = { body: "#9a958c", sleeves: "#9a958c", trim: "#5d564b" };

// Drawn on a 40 x 36 grid: sleeves first, the body over their inner edge, then the collar.
const KIT_PATHS = {
  left: "M13 2.5 L9 4.5 L1.5 9.5 L4.5 16.5 L9.6 14 Z",
  right: "M27 2.5 L31 4.5 L38.5 9.5 L35.5 16.5 L30.4 14 Z",
  body: "M13 2.5 Q20 8 27 2.5 L31 4.5 L31 33.5 Q20 35.2 9 33.5 L9 4.5 Z",
  collar: "M13 2.5 Q20 8 27 2.5",
};

/** The stripe patterns, once for the page; the cards fill with url(#kit-XXX). */
function initKits() {
  el("kitDefs").innerHTML = Object.entries(KITS).filter(([, k]) => k.stripes).map(([team, k]) =>
    `<pattern id="kit-${team}" patternUnits="userSpaceOnUse" width="6.4" height="36">
       <rect width="3.2" height="36" fill="${k.stripes[0]}"/><rect x="3.2" width="3.2" height="36" fill="${k.stripes[1]}"/>
     </pattern>`).join("");
}

function kitSVG(p) {
  const k = p.pos === "GK" ? KIT_KEEPER : (KITS[p.team] || KIT_UNKNOWN);
  const body = k.stripes ? `url(#kit-${p.team})` : k.body;
  const line = `stroke="${k.trim}" stroke-width="1.1" stroke-linejoin="round"`;
  return `<svg class="kit" viewBox="0 0 40 36" aria-hidden="true">
    <path d="${KIT_PATHS.left}" fill="${k.sleeves}" ${line}/>
    <path d="${KIT_PATHS.right}" fill="${k.sleeves}" ${line}/>
    <path d="${KIT_PATHS.body}" fill="${body}" ${line}/>
    <path d="${KIT_PATHS.collar}" fill="none" stroke="${k.trim}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

function cardHTML(pick) {
  const p = byId.get(pick.id);
  const isC = state.captain === pick.id, isV = state.vice === pick.id;
  const avail = availabilityBadge(p);

  const swappable = selectedPick && selectedPick !== pick.id;
  const cls = ["card"];
  if (selectedPick === pick.id) cls.push("is-selected");
  else if (swappable) cls.push("is-swappable");
  if (avail && avail.cls !== "rot") cls.push(`is-${avail.cls}`);

  return `<div class="${cls.join(" ")}" data-pos="${p.pos}" data-pick="${pick.id}" role="button" tabindex="0"
               aria-label="${p.name}, ${p.pos}, ${p.team}">
    ${pick.starting ? `
      <button class="badge c ${isC ? "is-on" : ""}" data-cap="${pick.id}" title="Captain">C</button>
      <button class="badge v ${isV ? "is-on" : ""}" data-vice="${pick.id}" title="Vice-captain">V</button>` : ""}
    <button class="badge x" data-remove="${pick.id}" title="Remove from squad">×</button>
    ${kitSVG(p)}
    <div class="nm">${p.name}</div>
    <div class="meta"><span>${p.team}</span><span>${p.pos}</span></div>
    <div class="fix">${fixtureText(p)}</div>
    <div class="next">${nextRunHTML(p)}</div>
    <div class="figs"><span>£${money(p.price)}</span>${livePill(pick.id)}${sheetButton(p, epOf(p).toFixed(1), "ep")}</div>
    ${availabilityPill(avail)}
  </div>`;
}

/**
 * "Why is he rated that": the model's figure decomposed into the scoring
 * terms it was built from, as a hover on the number itself. Every term is
 * from the same prediction, so they add up to the figure shown.
 */
function whyText(p) {
  const w = p.why;
  if (!w) return `Model xPts ${p.ep.toFixed(1)} for GW${DATA.gameweek}`;
  const pct = x => `${Math.round(x * 100)}%`;
  const s = x => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2);
  const lines = [
    `Model xPts ${p.ep.toFixed(1)} for GW${DATA.gameweek} — how it adds up`,
    `plays ${pct(w.p_play)} · 60+ min ${pct(w.p_60)} · about ${Math.round(w.expected_minutes)} min`,
    `appearance ${s(w.appearance)}  goals ${s(w.goals)}  assists ${s(w.assists)}`,
    `clean sheet ${s(w.clean_sheet)}  conceded ${s(w.goals_conceded)}  saves ${s(w.saves)}`,
    `defcon ${s(w.defcon)}  bonus ${s(w.bonus)}  cards ${s(w.cards)}`,
  ];
  return lines.join("\n");
}

/** Any xPts figure, as the button that opens that player's sheet. */
const sheetButton = (p, text, extra = "") =>
  `<button class="sheet-open ${extra}" data-sheet="${p.id}" title="${whyText(p)}">${text}</button>`;

/* =====================================================================
   Player sheet — the hover breakdown, laid out where it can be read: how
   likely he is to play, which scoring terms the figure is built from, the
   fixtures ahead and how the model has done on him so far.
   ===================================================================== */
const TERM_LABELS = {
  appearance: "Appearance", goals: "Goals", assists: "Assists",
  clean_sheet: "Clean sheet", goals_conceded: "Goals conceded", saves: "Saves",
  defcon: "Defensive contrib.", bonus: "Bonus", cards: "Cards", other: "Other",
};

const signed = (x, nd = 2) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(nd);

/** One prediction's scoring terms as bars, largest contribution first. */
function termsHTML(w, total) {
  const terms = Object.keys(TERM_LABELS).filter(t => t in w && Math.abs(w[t]) >= 0.005);
  terms.sort((a, b) => Math.abs(w[b]) - Math.abs(w[a]));
  const max = Math.max(0.01, ...terms.map(t => Math.abs(w[t])));
  return `<div class="terms">` + terms.map(t => `
      <span class="lbl">${TERM_LABELS[t]}</span>
      <span class="bar ${w[t] < 0 ? "neg" : ""}" title="${TERM_LABELS[t]}: ${signed(w[t])} pts">
        <span style="width:${(Math.abs(w[t]) / max * 100).toFixed(1)}%"></span></span>
      <span class="val">${signed(w[t])}</span>`).join("") + `
      <span class="lbl total">Expected points</span><span class="total"></span>
      <span class="val total">${total.toFixed(2)}</span>
    </div>`;
}

function meterHTML(label, value, frac) {
  const pct = Math.max(0, Math.min(1, frac)) * 100;
  return `<div class="meter"><div class="k">${label}</div><div class="v">${value}</div>
    <div class="rail"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div></div>`;
}

/**
 * The model against FPL's figure on this one player, for every reviewed
 * gameweek. Whichever landed closer to what he scored is marked.
 */
function playerTrackHTML(p) {
  if (!DATA.track) return "";
  const rows = DATA.track.players?.[p.id] || [];
  if (!rows.length) {
    return `<h3>The model on him this season</h3>
      <div class="note">Not in a reviewed gameweek with minutes or a meaningful prediction.</div>`;
  }
  const body = rows.map(([gw, xp, xpFpl, actual, mins]) => {
    const mMiss = Math.abs(xp - actual), fMiss = xpFpl === null ? Infinity : Math.abs(xpFpl - actual);
    return `<tr><td>GW${gw}</td>
      <td class="num ${mMiss < fMiss ? "better" : ""}">${xp.toFixed(1)}</td>
      <td class="num ${fMiss < mMiss ? "better" : ""}">${xpFpl === null ? "—" : xpFpl.toFixed(1)}</td>
      <td class="num">${actual}</td><td class="num">${mins}</td></tr>`;
  }).join("");
  return `<h3>The model on him this season</h3>
    <table class="mini"><thead><tr><th>Gameweek</th><th>Model</th><th>FPL</th><th>Scored</th><th>Min</th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="note">Green marks whichever prediction landed closer to what he scored.</div>`;
}

let sheetId = null;

function openSheet(id) {
  sheetId = id;
  renderSheet();
  const dialog = el("sheet");
  if (!dialog.open) dialog.showModal();
}

function renderSheet() {
  const p = byId.get(sheetId);
  if (!p) return;
  const w = p.why;
  const owned = !!pickOf(p.id);
  const blocked = owned ? "" : canAdd(p);

  const status = p.status === "available" ? "" :
    `<span class="status ${p.status === "doubtful" ? "doubtful" : "out"}">${p.status}${p.chance !== null ? `, ${p.chance}% chance` : ""}</span>`;

  const behind = currentGw() - DATA.gameweek;
  const staleNote = behind > 0
    ? `<div class="note">These are GW${DATA.gameweek}'s figures — the page is ${behind} gameweek${behind === 1 ? "" : "s"} old.</div>`
    : "";

  const played = Math.max(0, DATA.gwsPlayed || 0);
  const season = `${p.pts} pts in ${played} GW${played === 1 ? "" : "s"} · ${p.minutes.toLocaleString()} min · ` +
    `${p.starts} start${p.starts === 1 ? "" : "s"} · form ${p.form.toFixed(1)}` +
    (p.last ? ` · last season ${p.last.pts} pts in ${p.last.mins.toLocaleString()} min` : "");

  const fixtures = p.fixtures.filter(f => f.gw >= currentGw()).slice(0, 8);
  const runs = fixtures.length
    ? fixtures.map(f => `<span class="gwfix">GW${f.gw}<span class="fdr fdr-${tierOf(f)}"
        title="${fixtureTitle(f)}">${f.opp} ${f.home ? "(H)" : "(A)"}</span></span>`).join("")
    : `<span class="note">No fixtures on this page's calendar.</span>`;

  const breakdown = w ? `
    <h3>Playing time</h3>
    <div class="meters">
      ${meterHTML("Plays at all", `${Math.round(w.p_play * 100)}%`, w.p_play)}
      ${meterHTML("Plays 60+ minutes", `${Math.round(w.p_60 * 100)}%`, w.p_60)}
      ${meterHTML("Expected minutes", `${Math.round(w.expected_minutes)}`, w.expected_minutes / 90)}
    </div>
    ${(() => {
      const a = availabilityBadge(p);
      return a && a.cls === "rot"
        ? `<div class="note">${availabilityPill(a)} ${a.text === "BENCH"
            ? `Under ${Math.round(BENCH_P_PLAY * 100)}% to play at all — a squad filler, not a starter.`
            : `Under ${Math.round(ROTATION_P60 * 100)}% to last an hour: rested or subbed early often enough to cost appearance and clean-sheet points.`}</div>`
        : "";
    })()}
    <h3>Where GW${DATA.gameweek}'s ${p.ep.toFixed(1)} comes from</h3>
    ${termsHTML(w, p.ep)}
    <div class="note">Each term is that kind of point times the chance of it happening, so they add up to the figure.</div>`
    : `<div class="note" style="margin-top:14px">No breakdown for this player — the model has no prediction terms for him.</div>`;

  el("sheetBody").innerHTML = `
    <div class="sheet-head">
      <div class="who">
        <div class="nm" id="sheetName">${p.name}</div>
        <div class="sub">${p.team} · ${p.pos} · £${money(p.price)}m · ${p.owned.toFixed(1)}% owned</div>
        ${status}
      </div>
      <button class="close" data-close-sheet aria-label="Close">×</button>
    </div>
    <div class="figures">
      <div class="stat hero"><span class="k">Model xPts</span><span class="v">${p.ep.toFixed(1)}</span></div>
      <div class="stat"><span class="k">FPL xPts</span><span class="v">${p.epFpl.toFixed(1)}</span></div>
      <div class="stat"><span class="k">Pts / GW</span><span class="v">${pointsPerGameweek(p).toFixed(1)}</span></div>
    </div>
    <div class="note" style="margin-top:6px">${season}</div>
    ${staleNote}
    ${breakdown}
    <h3>Fixtures</h3>
    <div class="runs">${runs}</div>
    ${playerTrackHTML(p)}
    <div class="sheet-actions">
      ${owned
        ? `<button class="btn btn-danger" data-remove="${p.id}">Remove from squad</button>`
        : `<button class="btn btn-primary" data-add="${p.id}" ${blocked ? `disabled title="${blocked}"` : ""}>Add to squad</button>`}
      <button class="btn" data-close-sheet>Close</button>
    </div>`;
}

/* =====================================================================
   Track record — what `fpl review` has scored so far this season, so the
   numbers behind every call above can be checked against what happened.
   ===================================================================== */
function renderTrack() {
  const t = DATA.track;
  const box = el("track");
  if (!t || !t.games || !t.games.length) {
    el("trackSpan").textContent = "";
    box.innerHTML = `<div class="note" style="margin-top:0">No gameweek reviewed yet. Run <code>fpl review</code>
      the morning after a gameweek finishes, then rebuild — this then shows how the model's predictions held up
      against FPL's own, week by week.</div>`;
    return;
  }

  const all = t.games.find(g => g.gw === "all");
  const weeks = t.games.filter(g => g.gw !== "all");
  const span = t.gws.length > 1 ? `GW${t.gws[0]}–${t.gws[t.gws.length - 1]}` : `GW${t.gws[0]}`;
  el("trackSpan").textContent = span;

  const closer = all.model_mae < all.fpl_mae ? "closer than" : all.model_mae > all.fpl_mae ? "further off than" : "level with";
  const won = weeks.filter(g => g.model_mae < g.fpl_mae).length;
  const headline = `Over ${span}, the model missed by <b>${all.model_mae.toFixed(2)}</b> points a player on average,
    ${closer} FPL's own figure at <b>${all.fpl_mae.toFixed(2)}</b>` +
    (weeks.length > 1 ? ` — closer in ${won} of ${weeks.length} gameweeks` : "") + `.
    Picking the best XI from the whole pool on each, the model's would have scored <b>${all.model_xi}</b>
    and FPL's <b>${all.fpl_xi}</b>.`;

  // Lower is better for the miss, higher for the other two.
  const pair = (g, key, lowerBetter, nd) => {
    const m = g[`model_${key}`], f = g[`fpl_${key}`];
    const fmt = x => (x === null ? "—" : x.toFixed(nd));
    const mBetter = m !== null && f !== null && (lowerBetter ? m < f : m > f);
    const fBetter = m !== null && f !== null && (lowerBetter ? f < m : f > m);
    return `<td class="num ${mBetter ? "better" : ""}">${fmt(m)}</td><td class="num ${fBetter ? "better" : ""}">${fmt(f)}</td>`;
  };
  const row = g => `<tr class="${g.gw === "all" ? "all" : ""}">
      <td>${g.gw === "all" ? "Season" : `GW${g.gw}`}</td><td class="num">${Math.round(g.n)}</td>
      ${pair(g, "mae", true, 2)}${pair(g, "rank", false, 2)}${pair(g, "xi", false, 0)}</tr>`;
  const games = `<table class="mini">
      <thead>
        <tr><th></th><th></th>
          <th colspan="2" title="Mean absolute error, over players with recent minutes">Average miss</th>
          <th colspan="2" title="Spearman rank correlation within position — does it order players right?">Ranking</th>
          <th colspan="2" title="Real points of the best XI each would have picked from the whole pool">Best XI pts</th></tr>
        <tr><th>Gameweek</th><th>Players</th><th>Model</th><th>FPL</th><th>Model</th><th>FPL</th><th>Model</th><th>FPL</th></tr>
      </thead>
      <tbody>${weeks.map(row).join("")}${weeks.length > 1 ? row(all) : ""}</tbody></table>`;

  // A term is flagged only once there is enough of it to judge: a ratio of 2
  // on five predicted points is one goal.
  const termRow = r => {
    const ratio = Math.abs(r.predicted) > 1e-9 ? r.actual / r.predicted : null;
    const off = ratio !== null && Math.abs(r.predicted) >= 10 && (ratio < 0.8 || ratio > 1.25);
    return `<tr class="${r.term === "total" ? "all" : ""}">
      <td>${r.term === "total" ? "Total" : TERM_LABELS[r.term] || r.term}</td>
      <td class="num">${r.predicted.toFixed(1)}</td><td class="num">${r.actual.toFixed(0)}</td>
      <td class="num ratio ${off ? "off" : ""}">${ratio === null ? "—" : ratio.toFixed(2)}</td></tr>`;
  };
  const terms = `<table class="mini">
      <thead><tr><th>Scoring term</th><th>Predicted</th><th>Scored</th><th title="Scored ÷ predicted; 1.00 is exactly right">Ratio</th></tr></thead>
      <tbody>${t.terms.map(termRow).join("")}</tbody></table>`;

  box.innerHTML = `<div class="headline">${headline}</div>
    <h3>Model against FPL, week by week</h3>${games}
    <h3>Points handed out against points scored</h3>${terms}
    <div class="note">Summed over every predicted player. A ratio near 1.00 means the model hands out the right
      amount of that kind of point; amber marks a term more than 25% off.
      ${t.gws.length < 6 ? `With ${t.gws.length} gameweek${t.gws.length === 1 ? "" : "s"} reviewed this is a first look — one round of clean sheets or goals swings it a lot.` : ""}</div>`;
}

/* =====================================================================
   Fixture ticker — every club's run, easiest first, so the next signing
   can be shopped for by fixtures rather than one player at a time.
   ===================================================================== */
let tickerWeeks = 5;

/** Each club's fixtures, from any one of its players: they all share the list. */
const teamFixtures = (() => {
  const out = new Map();
  for (const p of DATA.players) if (!out.has(p.teamId)) out.set(p.teamId, p.fixtures);
  return out;
})();

/**
 * How kind a run is, in average games: each fixture counts its Elo multiplier
 * averaged over the four positions — 1.0 for an even game, more for a home tie
 * against a much weaker side — so a double counts both games and a blank
 * counts nothing, which is what they are worth to a team that owns his
 * players. The projections use the same multipliers, so the order here is the
 * order the transfer advice sees. Without Elo it falls back to 5 for a
 * difficulty-1 game down to 1 for a difficulty-5 one.
 */
function runEase(fixtures) {
  if (!fixtures.every(hasElo)) return fixtures.reduce((t, f) => t + (6 - f.difficulty), 0);
  return fixtures.reduce((t, f) => t + POSITIONS.reduce((s, pos) => s + eloMultiplier(pos, f.elo), 0) / POSITIONS.length, 0);
}
const easeText = e => (Number.isInteger(e) ? String(e) : e.toFixed(1));

function renderTicker() {
  const first = currentGw();
  const last = Math.min(first + 7, fixturesThrough(), RULES.lastGw);
  const box = el("ticker");
  if (last < first) {
    el("tickerSpan").textContent = "";
    box.innerHTML = `<div class="note">No fixtures left on this page's calendar — rebuild for the next ones.</div>`;
    return;
  }
  const gws = Array.from({ length: last - first + 1 }, (_, i) => first + i);
  const weeks = Math.min(tickerWeeks, gws.length);
  const ranked = new Set(gws.slice(0, weeks));
  el("tickerSpan").textContent = `GW${first}–${last}`;

  const owned = new Map();
  for (const pick of state.picks) {
    const t = byId.get(pick.id).teamId;
    owned.set(t, (owned.get(t) || 0) + 1);
  }

  const rows = DATA.teams.map(t => {
    const fixtures = teamFixtures.get(t.id) || [];
    return { team: t, fixtures, ease: runEase(fixtures.filter(f => ranked.has(f.gw))) };
  }).sort((a, b) => b.ease - a.ease || a.team.short.localeCompare(b.team.short));

  const head = `<tr><th>Club</th><th title="What the ranked gameweeks are worth, in average games">Ease</th>` +
    gws.map(g => `<th class="${ranked.has(g) ? "" : "beyond"}">GW${g}</th>`).join("") + `</tr>`;

  const body = rows.map(({ team, fixtures, ease }) => {
    const mine = owned.get(team.id) || 0;
    const cells = gws.map(g => {
      const fx = fixtures.filter(f => f.gw === g);
      const inner = fx.length
        ? fx.map(f => `<span class="fdr fdr-${tierOf(f)}" title="${fixtureTitle(f)}">${f.opp} ${f.home ? "(H)" : "(A)"}</span>`).join("")
        : `<span class="blank" title="GW${g}: blank">—</span>`;
      return `<td class="cell ${ranked.has(g) ? "" : "beyond"}">${inner}</td>`;
    }).join("");
    return `<tr class="${mine ? "is-yours" : ""}">
      <td><button class="team" data-team-filter="${team.id}" title="Show ${team.short} players in the pool">${team.short}</button>${
        mine ? `<span class="yours" title="${mine} of your players">×${mine}</span>` : ""}</td>
      <td class="ease">${easeText(ease)}</td>${cells}</tr>`;
  }).join("");

  // Late in the season fewer than 8 gameweeks remain; the choices shrink with them.
  const options = [...new Set([3, 5, 8].map(n => Math.min(n, gws.length)))]
    .map(n => `<option value="${n}" ${n === weeks ? "selected" : ""}>${n === 1 ? "gameweek" : `${n} gameweeks`}</option>`).join("");

  box.innerHTML = `
    <div class="controls"><label for="tickerWeeks">Rank over the next</label>
      <select id="tickerWeeks" aria-label="Gameweeks to rank on">${options}</select></div>
    <div class="scroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="note">${ELO
      ? `Ease is what the ranked weeks are worth in average games: each fixture counts its Elo multiplier, so an even
         game is 1.0, a double counts twice and a blank nothing. Colours are Elo tiers on FPL's 1–5 scale; hover a
         fixture for FPL's own rating.`
      : `Ease scores each game 5 for difficulty 1 down to 1 for difficulty 5, so a double counts twice and a blank
         counts nothing. Difficulty is FPL's rating.`}
      Click a club to show its players in the pool; ×2 beside a club is how many of your players it already has.</div>`;
}

function livePill(id) {
  const lp = livePointsFor(id);
  if (!lp) return "";
  const dnp = lp.status === "final" && lp.mins === 0;
  const cls = dnp ? "dnp" : lp.status;
  const title = dnp ? `GW${live.gw}: did not play`
    : `GW${live.gw}: ${lp.pts} point${lp.pts === 1 ? "" : "s"} so far, ${lp.mins} min${lp.status === "live" ? " — match in progress" : ""}`;
  return `<span class="lp ${cls}" title="${title}">${lp.pts}</span>`;
}

function slotHTML(pos) {
  return `<button class="slot" data-slot="${pos}">+ ${pos}</button>`;
}

function renderPitch() {
  const rows = POSITIONS.map(pos => {
    const inPos = starters().filter(p => posOf(p.id) === pos);
    const cards = inPos.map(cardHTML);
    // Show an empty place only while the squad is still being built.
    const shortfall = RULES.quota[pos] - countPos(pos);
    if (shortfall > 0) cards.push(slotHTML(pos));
    return `<div class="row">${cards.join("")}</div>`;
  });
  el("pitch").innerHTML = rows.join("");

  const bench = benched();
  const benchCards = bench.map(p => {
    const label = posOf(p.id) === "GK" ? "GK" : String(p.benchRank);
    return cardHTML(p).replace('<div class="meta">', `<div class="meta"><span style="color:var(--accent);font-weight:600">${label}</span>`);
  });
  el("bench").innerHTML = `<div class="bench-label">Bench — autosub order</div>` +
    (benchCards.length ? benchCards.join("") : `<div class="empty">Substitutes appear here once the XI is set.</div>`);

  el("formationLabel").textContent =
    state.picks.length === RULES.squadSize && starters().length === RULES.xiSize
      ? `Your XV — ${formation()}`
      : `Your XV — ${state.picks.length} of 15`;
}

function runHTML(p) {
  const fixtures = fixturesInHorizon(p);
  if (!fixtures.length) return `<span class="fdr fdr-3">no fixtures</span>`;
  return fixtures.map(f =>
    `<span class="fdr fdr-${tierOf(f)}" title="${fixtureTitle(f)}">${f.opp} ${f.home ? "(H)" : "(A)"}</span>`
  ).join("");
}

/**
 * Near-equal alternatives for the same outgoing player.
 *
 * Shown because the difference between the top option and these is inside the
 * model's own noise: presenting only the winner would imply a confidence the
 * numbers do not support, and the cheaper option is often the better buy.
 */
function altsHTML(move) {
  if (!move.alts || !move.alts.length) return "";
  const parts = move.alts.map(a => {
    const p = byId.get(a.inId);
    const cheaper = a.spend < move.spend
      ? `, £${money(move.spend - a.spend)}m cheaper`
      : "";
    return `<button class="linkish" data-move="${a.outId}:${a.inId}"
      title="Apply this instead">${p.name} +${a.gain.toFixed(1)}${cheaper}</button>`;
  });
  return `<div class="alts">too close to call: ${parts.join(" · ")}</div>`;
}

/**
 * Who else could fund this signing, and who nearly could.
 *
 * The blocked line exists because "why not sell Pedro Porro?" has a real answer
 * — he is £0.1m short of affording Tarkowski — and without it the pairing looks
 * arbitrary.
 */
function sellAltsHTML(move) {
  const parts = [];

  if (move.sellAlts && move.sellAlts.length) {
    const options = move.sellAlts.map(a =>
      `<button class="linkish" data-move="${a.id}:${move.inId}"
        title="Sell this player instead">${byId.get(a.id).name} +${a.gain.toFixed(1)}</button>`
    );
    parts.push(`<div class="alts">or sell instead: ${options.join(" · ")}</div>`);
  }

  if (move.sellBlocked && move.sellBlocked.length) {
    // About the alternative, not this move: worded so it cannot read as "this
    // transfer is unaffordable" under a suggestion that fits the bank.
    const blocked = move.sellBlocked;
    const lead = blocked.length === 1
      ? `selling ${byId.get(blocked[0].id).name} instead would leave you £${money(blocked[0].shortfall)}m short`
      : `selling these instead would leave you short: ` +
        blocked.map(b => `${byId.get(b.id).name} (£${money(b.shortfall)}m)`).join(" · ");
    parts.push(`<div class="alts">${lead}</div>`);
  }

  return parts.join("");
}

/** Say when a suggestion deliberately doubles up on a strong defence. */
function doubleUpHTML(move) {
  const d = move.doubleUp;
  if (!d) return "";
  return `<div class="alts" style="color:var(--good)">doubling up on the ${d.short} defence —
    ${d.cs} clean sheets in ${d.games} last season, ${d.concededPerGame} conceded a game</div>`;
}

function moveHTML(move, isTop) {
  const out = byId.get(move.outId), inn = byId.get(move.inId);
  const spend = move.spend;
  const cost = spend === 0 ? "same price" : spend > 0 ? `−£${money(spend)}m` : `+£${money(-spend)}m`;

  return `<div class="move ${isTop ? "is-top" : ""}">
    <div class="side out">
      <div class="who">${out.name}<span class="tag">out</span></div>
      <div class="why">${out.team} · ${reasonsOut(out)}</div>
      <div class="runs">${runHTML(out)}</div>
      ${sellAltsHTML(move)}
    </div>
    <div class="arrow">→</div>
    <div class="side in">
      <div class="who">${inn.name}<span class="tag">in</span></div>
      <div class="why">${inn.team} · ${reasonsIn(inn)}</div>
      <div class="runs">${runHTML(inn)}</div>
      ${altsHTML(move)}
      ${doubleUpHTML(move)}
    </div>
    <div class="delta">
      <div class="g">+${move.gain.toFixed(1)}</div>
      ${hitForNextTransfer() > 0
        ? `<div class="cost" style="color:var(--danger)">${(move.gain - hitForNextTransfer()).toFixed(1)} after −${hitForNextTransfer()}</div>`
        : ""}
      <div class="cost">${cost}</div>
      <div class="apply"><button class="btn" data-move="${move.outId}:${move.inId}">Apply</button></div>
    </div>
  </div>`;
}

function staleHTML() {
  if (!dataIsStale()) return "";
  const behind = currentGw() - DATA.gameweek;
  // Name the deadline that actually rolled the page over: built for GW6 and now
  // planning GW8 means the GW7 deadline is the one just passed, not GW6's.
  const passed = behind === 1
    ? `The GW${DATA.gameweek} deadline has passed`
    : `This page was built for GW${DATA.gameweek} and the GW${currentGw() - 1} deadline has passed`;
  return `<div class="notice warn" style="margin:11px 14px">
    <span>${passed}, so this is now GW${currentGw()}.
    Your transfers and chips have rolled over, but the prices and projections on
    this page are ${behind} gameweek${behind === 1 ? "" : "s"} old.
    Run <code>fpl serve</code> again for current numbers.</span></div>`;
}

/**
 * The call bar: a verdict, the sentence behind it, and — when there is a move
 * worth making — its gain and the button that makes it.
 */
function callHTML(kind, head, why, move = null, net = null) {
  const act = move
    ? `<div class="act"><div class="gain">+${(net ?? move.gain).toFixed(1)}<small>pts</small></div>
         <button class="btn btn-primary" data-move="${move.outId}:${move.inId}">Make this transfer</button></div>`
    : "";
  return `<div class="callbar ${kind}">
    <div><span class="lbl">The call</span><span class="head">${head}</span></div>
    <div class="why">${why}</div>${act}</div>`;
}

function renderAdvice() {
  const box = el("advice");
  const call = el("call");

  if (state.picks.length !== RULES.squadSize) {
    const left = RULES.squadSize - state.picks.length;
    call.innerHTML = staleHTML() + callHTML("build", "Build your XV",
      `Pick ${left} more player${left === 1 ? "" : "s"} from the pool on the right — or start from a
       <b>Wildcard draft</b> — and the call on your transfers appears here.`);
    box.innerHTML = `<div class="empty">Fill all 15 places to get transfer suggestions.</div>`;
    el("countTransfers").textContent = "";
    return;
  }

  const moves = singleMoves(6);
  const best = moves[0];
  const gws = horizonGws();
  // "GW3-3" is not a range; a single gameweek is just that gameweek.
  const window = gws.length > 1
    ? `GW${gws[0]}–${gws[gws.length - 1]}`
    : `GW${gws[0] ?? DATA.gameweek}`;
  // And a per-week figure only says something when there is more than one week.
  const weekly = g => (horizon > 1 ? ` (${perGw(g).toFixed(1)} a week)` : "");

  // What one more transfer actually costs right now. With the free one already
  // spent this is 4 points, and a gain has to clear that before it is a gain at
  // all — comparing the gross number against the threshold recommends moves
  // that lose points.
  const nextHit = hitForNextTransfer();
  const net = best ? best.gain - nextHit : 0;

  // What holding actually banks. Saying "two next week" assumed you had one in
  // hand — with the free transfer already spent on a hit, holding gets you one.
  const nextWeekFts = Math.min(
    RULES.maxRolledTransfers,
    Math.max(0, state.freeTransfers - transfersMade()) + RULES.freeTransfersPerGw
  );
  const ftPhrase = `${nextWeekFts} free transfer${nextWeekFts === 1 ? "" : "s"}`;

  const names = m => `<b>${byId.get(m.outId).name} → ${byId.get(m.inId).name}</b>`;
  let verdict;
  if (!best) {
    verdict = callHTML("hold", "Roll it",
      `Nothing in your price range improves this squad over ${window}.
       Bank it and you start GW${currentGw() + 1} with ${ftPhrase}.`);
  } else if (nextHit > 0 && net <= 0) {
    verdict = callHTML("hold", "You are done",
      `No free transfer left, so another move costs <b>${nextHit} points</b>. The best one
       available, ${names(best)}, gains <b>+${best.gain.toFixed(1)}</b> over ${window}, which nets
       <b>${net.toFixed(1)}</b> — it loses you points. Leave it, and you get ${ftPhrase} for
       GW${currentGw() + 1}.`);
  } else if (nextHit > 0) {
    verdict = callHTML("go", "Only with a hit",
      `${names(best)} gains <b>+${best.gain.toFixed(1)}</b> over ${window} but costs ${nextHit} points,
       netting <b>+${net.toFixed(1)}</b>. Worth it only if you believe the numbers — one gameweek of
       evidence is thin.`, best, net);
  } else if (best.gain < WORTH_A_TRANSFER) {
    verdict = callHTML("hold", "Probably roll it",
      `The best move on the board, ${names(best)}, is worth about <b>+${best.gain.toFixed(1)} pts</b>
       across ${window}${weekly(best.gain)}. That is inside the noise. Holding gives you ${ftPhrase}
       next week and more information.`);
  } else {
    verdict = callHTML("go", "Use it",
      `${names(best)} is worth about <b>+${best.gain.toFixed(1)} pts</b> over ${window}${weekly(best.gain)}
       and fits your £${money(bank())}m bank.`, best);
  }

  const list = moves.length
    ? `<div class="moves">${moves.map((m, i) => moveHTML(m, i === 0)).join("")}</div>`
    : "";

  const pairs = pairMoves(3).filter(p => p.gain - p.hit > 0);
  const pairsHTML = pairs.length
    ? `<div class="pairs"><div class="lbl">Two transfers — second one costs ${RULES.hitCost} points</div>` +
      pairs.map(p => {
        const net = p.gain - p.hit;
        return `<div class="pair">
          <span class="net ${net > 0 ? "good" : "bad"}">${net > 0 ? "+" : ""}${net.toFixed(1)} pts net</span>
          <span style="color:var(--ink-faint)"> (+${p.gain.toFixed(1)} gross${p.hit ? `, −${p.hit} hit` : ""})</span>
          <div class="legs">${byId.get(p.first.outId).name} → ${byId.get(p.first.inId).name}
            &nbsp;·&nbsp; ${byId.get(p.second.outId).name} → ${byId.get(p.second.inId).name}</div>
        </div>`;
      }).join("") + `</div>`
    : "";

  call.innerHTML = staleHTML() + verdict;
  box.innerHTML = list + pairsHTML ||
    `<div class="empty">Nothing in your price range improves this squad over ${window}.</div>`;
  el("countTransfers").textContent = moves.length ? String(moves.length) : "";
  el("countTransfers").classList.toggle("hot", !!best && best.gain >= WORTH_A_TRANSFER && net > 0);
}

function renderArmbands() {
  const entry = (mark, id, cls) => {
    const p = id ? byId.get(id) : null;
    const fixture = p ? fixturesInHorizon(p).filter(f => f.gw === currentGw()) : [];
    const where = fixture.length
      ? fixture.map(f => `${f.opp} ${f.home ? "(H)" : "(A)"}`).join(", ")
      : "no fixture";
    return `<div class="armband ${cls}" title="${p ? `${p.name} — ${where}` : "not set"}">
      <span class="mark">${mark}</span>
      ${p ? `<span class="who">${p.name}</span>` : `<span class="none">not set</span>`}
    </div>`;
  };
  el("armbands").innerHTML =
    entry("C", state.captain, "captain") + entry("V", state.vice, "vice");
}

function renderNotices() {
  // Where the team came from, while it is still the latest FPL has: after the
  // next deadline the import is a week old and a rebuild brings the new one.
  const imp = state.imported;
  const source = imp
    ? `<div class="notice info"><span>Your FPL team <b>${imp.name}</b>, as it stood at the GW${imp.gw} deadline${
        imp.gw < currentGw() - 1 ? ` — run <code>fpl serve</code> again to import GW${currentGw() - 1}'s` : ""}.
        Transfers you make in the FPL app before a deadline stay private until it passes, so they are not here yet.${
        (imp.notes || []).map(n => ` ${n}.`).join("")}</span></div>`
    : "";
  el("notices").innerHTML = source + validate().map(v =>
    `<div class="notice ${v.level === "err" ? "err" : v.level === "ok" ? "ok" : "warn"}">${v.msg}</div>`
  ).join("");
}

function renderChips() {
  const set = chipSet(currentGw());
  const head = `<div class="lbl">Chips — set ${set} (${set === 1 ? "gameweeks 1–19" : "gameweeks 20–38"}), one per gameweek</div>`;
  el("chipbar").innerHTML = head + CHIPS.map(c => {
    const spent = state.chipsUsed[`${set}:${c.id}`];
    const active = state.activeChip === c.id;
    const why = chipAvailable(c.id);
    const cls = ["chip"];
    if (active) cls.push("is-active");
    if (spent) cls.push("is-spent");
    return `<button class="${cls.join(" ")}" data-chip="${c.id}" ${spent || (why && !active) ? "disabled" : ""}
      title="${spent ? `Played in GW${spent}` : (why || c.note)}"><span class="dot"></span>${c.name}</button>`;
  }).join("");
}

function renderChipAdvice() {
  const box = el("chipAdvice");
  if (state.picks.length !== RULES.squadSize) {
    box.innerHTML = `<div class="lbl">Chip timing</div><div class="empty">Fill all 15 places to get chip advice.</div>`;
    return;
  }

  const verdicts = chipVerdicts();
  const gws = chipLookahead();
  const now = currentGw();
  const window = gws.length > 1 ? `next ${gws.length} gameweeks, to GW${gws[gws.length - 1]}` : `GW${now}`;

  // What to do *this* week: any chip whose best week is now. Only one can be
  // played, so if two want the same week the bigger number wins.
  const playNow = CHIPS.filter(c => verdicts[c.id].verdict === "play" && verdicts[c.id].gw === now)
    .sort((a, b) => (verdicts[b.id].gain || 0) - (verdicts[a.id].gain || 0));
  const selected = state.activeChip ? CHIPS.find(c => c.id === state.activeChip) : null;
  let headline;
  if (playNow.length) {
    const top = playNow[0];
    const also = playNow.slice(1).map(c => c.name);
    headline = `<b class="go">This week: play the ${top.name}.</b>` +
      (also.length ? ` ${also.join(" and ")} also point${also.length === 1 ? "s" : ""} at this week, but only one chip can be played — the ${top.name} is worth more.` : "");
  } else {
    const next = CHIPS.map(c => verdicts[c.id]).filter(v => v.verdict === "play")
      .sort((a, b) => a.gw - b.gw)[0];
    headline = `<b class="hold">This week: no chip.</b>` +
      (next ? ` The next window is GW${next.gw}.` : ` Nothing in the ${window} calls for one.`);
  }
  if (selected) {
    headline += ` <span class="sel">You have the ${selected.name} selected for GW${now}.</span>`;
  }

  const rows = CHIPS.map(c => {
    const v = verdicts[c.id];
    const badge = v.verdict === "played" ? `Played GW${v.gw}`
      : v.verdict === "play" ? (v.gw === now ? "Play now" : `Play GW${v.gw}`)
      : (v.expiring ? "Use or lose" : "Hold");
    const cls = v.verdict === "played" ? "played" : v.verdict === "play" ? "play" : (v.expiring ? "expiring" : "hold");
    return `<div class="row"><span class="name">${c.name}</span><span class="badge ${cls}">${badge}</span><span class="why">${v.why}</span></div>`;
  }).join("");

  box.innerHTML =
    `<div class="lbl">Chip timing — ${window}</div>` +
    `<div class="now">${headline}</div>` +
    rows +
    `<div class="note">Same projections as the transfer advice, one week at a time. Doubles and blanks are where chips pay, so this is only as good as the fixtures it can see.</div>`;
}

function renderLog() {
  if (!state.history.length) {
    el("log").innerHTML = `<span style="color:var(--ink-faint)">Saving records your transfers and settles the hit. The gameweek itself follows the real FPL calendar — rebuild after the deadline to move to GW${currentGw() + 1}.</span>`;
    return;
  }
  const rows = state.history.slice(-8).reverse().map(h =>
    `<li>GW${h.gw}: ${h.transfers} transfer${h.transfers === 1 ? "" : "s"}` +
    (h.hit ? `, <b style="color:var(--danger)">−${h.hit} pts</b>` : "") +
    (h.chip ? `, ${CHIPS.find(c => c.id === h.chip).name}` : "") +
    (h.captain ? `, captain ${h.captain}` : "") + `</li>`
  ).join("");
  el("log").innerHTML = `<ol>${rows}</ol>` +
    (state.totalHits ? `<div style="margin-top:6px">Total taken in hits: <b style="color:var(--danger)">−${state.totalHits} pts</b></div>` : "");
}

const COLUMNS = [
  { key: "name", label: "Player", sortable: true },
  { key: "fix", label: "Fixture", sortable: false },
  { key: "price", label: "£", sortable: true },
  { key: "ep", label: "Model", sortable: true },
  { key: "epFpl", label: "FPL", sortable: true },
  { key: "ppgw", label: "PPGW", sortable: true },
  { key: "owned", label: "TSB%", sortable: true },
  { key: "add", label: "", sortable: false },
];

function renderPool() {
  el("poolHead").innerHTML = COLUMNS.map(c =>
    `<th data-sort="${c.sortable ? c.key : ""}" class="${sort.key === c.key ? "is-sorted" : ""}">${c.label}${
      c.sortable && sort.key === c.key ? (sort.dir < 0 ? " ↓" : " ↑") : ""}</th>`
  ).join("");

  const q = filters.search.trim().toLowerCase();
  let rows = DATA.players.filter(p => {
    if (filters.pos !== "ALL" && p.pos !== filters.pos) return false;
    if (filters.team !== "ALL" && String(p.teamId) !== filters.team) return false;
    if (filters.avail === "fit" && p.status !== "available") return false;
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false;
    return true;
  });

  const sortValue = (p, k) => {
    if (k === "name") return p.name.toLowerCase();
    if (k === "ppgw") return pointsPerGameweek(p);
    return p[k];
  };
  rows.sort((a, b) => {
    const k = sort.key;
    const va = sortValue(a, k);
    const vb = sortValue(b, k);
    if (va < vb) return -sort.dir;
    if (va > vb) return sort.dir;
    return 0;
  });

  el("poolCount").textContent = `${rows.length} shown`;

  if (!rows.length) {
    el("poolBody").innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty">No players match those filters.</td></tr>`;
    return;
  }

  el("poolBody").innerHTML = rows.slice(0, 250).map(p => {
    const owned = !!pickOf(p.id);
    const why = owned ? "In your squad" : canAdd(p);
    return `<tr class="${owned ? "is-owned" : ""}">
      <td><div class="p-name"><button class="sheet-open" data-sheet="${p.id}" title="Open ${p.name}'s sheet">${p.name}</button>${availabilityPill(availabilityBadge(p))}</div><div class="p-sub">${p.team} · ${p.pos}</div></td>
      <td>${fixtureText(p)}</td>
      <td class="num">${money(p.price)}</td>
      <td class="num" ${metric === "ep" ? 'style="color:var(--accent);font-weight:600"' : ""}>${sheetButton(p, p.ep.toFixed(1))}</td>
      <td class="num" ${metric === "epFpl" ? 'style="color:var(--accent);font-weight:600"' : ""}>${p.epFpl.toFixed(1)}</td>
      <td class="num" ${metric === "ppgw" ? 'style="color:var(--accent);font-weight:600"' : ""}>${pointsPerGameweek(p).toFixed(1)}</td>
      <td class="num">${p.owned.toFixed(1)}</td>
      <td>${owned
        ? `<button class="add" data-remove="${p.id}" title="Remove from squad" style="color:var(--danger)">−</button>`
        : `<button class="add" data-add="${p.id}" ${why ? "disabled" : ""} title="${why || "Add to squad"}">+</button>`}</td>
    </tr>`;
  }).join("");
}

function render() {
  save();
  renderLedger();
  renderAdvice();
  renderArmbands();
  renderNotices();
  renderPitch();
  renderChips();
  renderChipAdvice();
  renderTicker();
  renderLog();
  renderPool();
  if (el("sheet").open) renderSheet();
  renderTray();
  const toPlay = state.picks.length === RULES.squadSize
    ? Object.values(chipVerdicts()).filter(v => v.verdict === "play").length : 0;
  el("countChips").textContent = toPlay ? `${toPlay} to play` : "";
  el("countChips").classList.toggle("hot", toPlay > 0);
  el("confirm").disabled = !isLegal();
  el("confirm").textContent = state.confirmedForGw === currentGw()
    ? (transfersMade() ? `Save changes` : `Saved for GW${currentGw()}`)
    : `Save as my GW${currentGw()} team`;
  el("gwLabel").textContent = `GW${currentGw()}`;

  renderDeadline();
}

/** The clock the page is named after: when, and how long is left. */
function renderDeadline() {
  const deadline = currentDeadline();
  if (!deadline) { el("deadline").innerHTML = ""; return; }
  const when = deadline.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const ms = deadline - Date.now();
  let left;
  if (ms <= 0) {
    left = `<span class="left passed">deadline passed</span>`;
  } else {
    const mins = Math.floor(ms / 60_000);
    const d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    const text = d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
    left = `<span class="left ${ms < 86_400_000 ? "soon" : ""}">${text} to go</span>`;
  }
  el("deadline").innerHTML = `<span>Deadline ${when}</span>${left}`;
}

/* =====================================================================
   Wiring
   ===================================================================== */
function initChrome() {
  // Every horizon up to the one the page was built with, not a sparse 1/3/5:
  // the interesting comparison is often one step, and skipping 2 and 4 hides it.
  const maxHorizon = Math.max(1, Number(DATA.horizon) || 5);
  el("horizon").innerHTML = Array.from({ length: maxHorizon }, (_, i) => i + 1)
    .map(h => `<option value="${h}" ${horizon === h ? "selected" : ""}>${h === 1 ? "1 gameweek" : h + " gameweeks"}</option>`)
    .join("");

  el("metric").innerHTML = METRICS.map(m =>
    `<option value="${m.key}" ${metric === m.key ? "selected" : ""}>${m.label}</option>`).join("");

  el("posTabs").innerHTML = ["ALL", ...POSITIONS].map(p =>
    `<button class="tab ${filters.pos === p ? "is-on" : ""}" data-pos="${p}">${p === "ALL" ? "All" : p}</button>`
  ).join("");

  el("teamFilter").innerHTML = `<option value="ALL">All clubs</option>` +
    DATA.teams.map(t => `<option value="${t.id}">${t.short}</option>`).join("");

  el("foot").innerHTML =
    `<p style="margin:0 0 6px"><b>Model</b> xPts comes from the <code>${DATA.model}</code> model — ` +
    `gradient-boosted components for minutes, attack, defence and bonus, combined through the scoring rules, ` +
    `with the betting market's expected goals for each side. It does not read FPL's figure: the historical ` +
    `record of that figure was captured after the matches, so a model trained on it learns the result. ` +
    `<b>FPL</b> xPts is therefore an independent second opinion. Ranking, sorting and auto-pick follow ` +
    `whichever you select. On walk-forward backtests the model ranked players with recent minutes within ` +
    `position at Spearman 0.48–0.49 over 2024-25 and 2025-26, against 0.36–0.40 for simple form baselines — ` +
    `useful, and humbler than the figures this page once quoted. ` +
    (DATA.oddsPriced === false
      ? `<b>No betting odds</b> were published for GW${DATA.gameweek} when this was built, so it uses the model ` +
        `fitted without them; rebuild two or three days before the deadline for the odds-informed figures. `
      : "") +
    `With only ${DATA.gameweek - 1} gameweek${DATA.gameweek === 2 ? "" : "s"} of this season played, treat ` +
    `the ordering as more trustworthy than the magnitudes.</p>` +
    `<p style="margin:0">GW${DATA.gameweek}, ${DATA.season}. Prices and fixtures captured ` +
    `${new Date(DATA.generatedAt).toLocaleDateString()} — rebuild with <code>fpl serve</code> ` +
    `before each deadline. ` +
    (SERVER
      ? `Your squad is kept in this browser and, when you press <b>Save team</b>, in <code>config.local.yaml</code>.`
      : `Your squad is saved in this browser only — run <code>fpl serve</code> to save it to <code>config.local.yaml</code>.`) +
    `</p>`;
}

document.addEventListener("click", e => {
  const t = e.target;

  const wt = t.closest("[data-tab]");
  if (wt) return showTab(wt.dataset.tab);
  if (t.closest("[data-undo], #undo")) { t.closest(".toast")?.remove(); return undo(); }

  // Before the card's own handler: opening a sheet must not also pick the card up.
  const sheetBtn = t.closest("[data-sheet]");
  if (sheetBtn) { e.stopPropagation(); return openSheet(Number(sheetBtn.dataset.sheet)); }
  if (t.closest("[data-close-sheet]")) return el("sheet").close();

  const teamBtn = t.closest("[data-team-filter]");
  if (teamBtn) {
    filters.team = teamBtn.dataset.teamFilter;
    el("teamFilter").value = filters.team;
    return renderPool();
  }
  // Adding or removing from the sheet finishes with it; the squad is what changed.
  if (t.closest("#sheet [data-add], #sheet [data-remove]")) el("sheet").close();

  const add = t.closest("[data-add]");
  if (add) { const id = Number(add.dataset.add); return withUndo(`Added ${byId.get(id).name}`, () => addPlayer(id)); }

  const rm = t.closest("[data-remove]");
  if (rm) {
    e.stopPropagation();
    const id = Number(rm.dataset.remove);
    return withUndo(`Removed ${byId.get(id).name}`, () => removePlayer(id));
  }

  const cap = t.closest("[data-cap]");
  if (cap) {
    e.stopPropagation();
    const id = Number(cap.dataset.cap);
    return withUndo(() => (state.captain === id ? `${byId.get(id).name} is captain` : "Captain removed"), () => {
      if (state.vice === id) state.vice = state.captain;
      state.captain = state.captain === id ? null : id;
      render();
    });
  }

  const vice = t.closest("[data-vice]");
  if (vice) {
    e.stopPropagation();
    const id = Number(vice.dataset.vice);
    return withUndo(() => (state.vice === id ? `${byId.get(id).name} is vice-captain` : "Vice-captain removed"), () => {
      if (state.captain === id) state.captain = state.vice;
      state.vice = state.vice === id ? null : id;
      render();
    });
  }

  const mv = t.closest("[data-move]");
  if (mv) {
    const [outId, inId] = mv.dataset.move.split(":").map(Number);
    return withUndo(`${byId.get(outId).name} → ${byId.get(inId).name}`, () => applyMove({ outId, inId }));
  }

  const chip = t.closest("[data-chip]");
  if (chip && !chip.disabled) {
    const c = CHIPS.find(x => x.id === chip.dataset.chip);
    return withUndo(() => (state.activeChip === c.id ? `${c.name} played` : `${c.name} cancelled`), () => toggleChip(c.id));
  }

  const slot = t.closest("[data-slot]");
  if (slot) { filters.pos = slot.dataset.slot; initChrome(); return render(); }

  const card = t.closest("[data-pick]");
  if (card) {
    const id = Number(card.dataset.pick);
    if (selectedPick === null) selectedPick = id;
    else if (selectedPick === id) selectedPick = null;
    else {
      const a = byId.get(selectedPick).name, b = byId.get(id).name, from = selectedPick;
      return withUndo(`Swapped ${a} and ${b}`, () => attemptSwap(from, id));
    }
    return render();
  }

  const tab = t.closest("[data-pos]");
  if (tab && tab.classList.contains("tab")) { filters.pos = tab.dataset.pos; initChrome(); return render(); }

  const th = t.closest("th[data-sort]");
  if (th && th.dataset.sort) {
    const k = th.dataset.sort;
    sort = { key: k, dir: sort.key === k ? -sort.dir : (k === "name" ? 1 : -1) };
    return renderPool();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && selectedPick !== null) { selectedPick = null; render(); }
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || el("sheet").open;
  if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); return undo(); }
  if (!typing && e.key === "/") { e.preventDefault(); return el("search").focus(); }
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && /^[1-4]$/.test(e.key)) return showTab(TABS[Number(e.key) - 1]);
  if (e.key === "Enter" || e.key === " ") {
    // Only the card itself: its buttons (armbands, the sheet) activate on their own.
    const card = e.target.closest?.("[data-pick]");
    if (card && e.target === card) { e.preventDefault(); card.click(); }
  }
});

// The ticker is redrawn with every render, so its control is listened for here.
document.addEventListener("change", e => {
  if (e.target.id === "tickerWeeks") { tickerWeeks = Number(e.target.value); renderTicker(); }
});

// A click on the dimmed backdrop lands on the dialog itself, not its body.
el("sheet").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

el("search").addEventListener("input", e => { filters.search = e.target.value; renderPool(); });
el("teamFilter").addEventListener("change", e => { filters.team = e.target.value; renderPool(); });
el("availFilter").addEventListener("change", e => { filters.avail = e.target.value; renderPool(); });
el("horizon").addEventListener("change", e => { horizon = Number(e.target.value); render(); });
el("metric").addEventListener("change", e => {
  metric = e.target.value;
  if (["ep", "epFpl", "ppgw"].includes(sort.key)) sort = { key: metric === "form" ? "ep" : metric, dir: -1 };
  render();
});
el("copySquad").addEventListener("click", copySquad);
el("autoSquad").addEventListener("click", () => withUndo("Wildcard draft", autoPickSquad));
el("confirm").addEventListener("click", () => withUndo(`Saved as your GW${currentGw()} team`, lockInSquad));
el("reset").addEventListener("click", () => withUndo("Squad reset", resetAll));
el("saveConfig").addEventListener("click", saveConfig);
el("importTeam").addEventListener("click", importTeam);
el("setupTeam").addEventListener("keydown", e => { if (e.key === "Enter") importTeam(); });
// Typing a bank or transfer count takes effect on the page straight away, so
// affordability and hit checks are right before anything is written to disk.
el("setupBank").addEventListener("change", () => {
  const v = readBankField();
  if (v === null) return;
  applyBank(Math.round(v * 10));
  save();
  render();
});
el("setupFt").addEventListener("change", () => {
  const v = readFtField();
  if (v === null) return;
  state.freeTransfers = v;
  save();
  render();
});

initKits();
initChrome();
showTab(activeTab);
renderTrack();
if (startedFromPreset || adoptedNewerBuild) applyBestXI();   // gives the loaded squad a legal XI and a captain
render();
if (adoptedNewerBuild) {
  save();   // so the adopted squad survives the next reload without re-adopting
  flash("This page was rebuilt with a different squad — updated to match your latest team and bank.");
}
loadConfig();   // shows the save strip when a local helper is behind the page
loadLive();     // points so far this gameweek, when the helper can fetch them
setInterval(loadLive, 60_000);
setInterval(renderDeadline, 30_000);

// The pool sits just under the sticky header, whose height depends on how the
// ledger wraps at this width.
const syncTopbar = () => document.documentElement.style.setProperty(
  "--topbar-h", `${document.querySelector(".topbar").offsetHeight}px`);
window.addEventListener("resize", syncTopbar);
syncTopbar();

// A page left open over a Friday evening should not still be showing last
// week. Cheap enough to poll: it only does work when the gameweek changes.
let renderedGw = currentGw();
setInterval(() => {
  const live = currentGw();
  if (live === renderedGw) return;
  renderedGw = live;
  syncToCalendar();
  render();
  flash(`The GW${live - 1} deadline has passed — now planning GW${live}.`);
}, 60_000);
</script>
